services:
  # Database
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cortexiq
      POSTGRES_USER: cortexiq
      POSTGRES_PASSWORD: cortexiq_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CortexIQ: MCP server + HTTP (dashboard + metrics) + background consolidation
  cortexiq:
    build: .
    command: ["serve", "--http-host", "0.0.0.0", "--http-port", "9090", "--mcp-host", "0.0.0.0", "--mcp-port", "8080"]
    ports:
      - "8080:8080" # MCP over SSE
      - "9090:9090" # web dashboard at /ui, plus /metrics, /healthz, /readyz
    environment:
      # Required
      CORTEXIQ_POSTGRES_DSN: postgresql://cortexiq:cortexiq_dev_password@postgres:5432/cortexiq?sslmode=disable
      CORTEXIQ_VECTOR_DIM: 1536
      CORTEXIQ_MAX_RESULT_SIZE: 10000
      CORTEXIQ_OPENAI_API_KEY: ${CORTEXIQ_OPENAI_API_KEY}
      CORTEXIQ_OPENAI_BASE_URL: ${CORTEXIQ_OPENAI_BASE_URL}
      CORTEXIQ_EMBEDDING_MODEL: ${CORTEXIQ_EMBEDDING_MODEL}
      # Optional embedding overrides (fall back to the OpenAI settings when empty)
      CORTEXIQ_EMBEDDING_BASE_URL: ${CORTEXIQ_EMBEDDING_BASE_URL:-}
      CORTEXIQ_EMBEDDING_API_KEY: ${CORTEXIQ_EMBEDDING_API_KEY:-}
      CORTEXIQ_REASONER_MODEL: ${CORTEXIQ_REASONER_MODEL}
      CORTEXIQ_REASONER_MAX_TOKENS: ${CORTEXIQ_REASONER_MAX_TOKENS:-1024}
      CORTEXIQ_REASONER_JSON_MODE: ${CORTEXIQ_REASONER_JSON_MODE:-false}
      CORTEXIQ_MODEL_PRICES: ${CORTEXIQ_MODEL_PRICES:-}
      CORTEXIQ_CONTEXT_TTL: 1h
      CORTEXIQ_HTTP_ADDR: :9090
      CORTEXIQ_API_TOKEN: ${CORTEXIQ_API_TOKEN:-}
      CORTEXIQ_API_TOKENS: ${CORTEXIQ_API_TOKENS:-}
      CORTEXIQ_LOG_LEVEL: info
      CORTEXIQ_LOG_FORMAT: text
      # Optional consolidation configs
      CORTEXIQ_CONSOLIDATION_BATCH_SIZE: 100
      CORTEXIQ_RECALL_MIN_SIMILARITY: ${CORTEXIQ_RECALL_MIN_SIMILARITY:-0}
      CORTEXIQ_HYBRID_RECALL: ${CORTEXIQ_HYBRID_RECALL:-true}
      CORTEXIQ_RELATIONSHIP_BATCH_SIZE: ${CORTEXIQ_RELATIONSHIP_BATCH_SIZE:-5}
      CORTEXIQ_MAX_LLM_CALLS_PER_RUN: ${CORTEXIQ_MAX_LLM_CALLS_PER_RUN:-0}
      CORTEXIQ_CONSOLIDATION_SIMILARITY_THRESHOLD: 0.85
      CORTEXIQ_CONSOLIDATION_DEDUP_THRESHOLD: ${CORTEXIQ_CONSOLIDATION_DEDUP_THRESHOLD:-0.90}
      CORTEXIQ_CONSOLIDATION_DEDUP_REVIEW_THRESHOLD: ${CORTEXIQ_CONSOLIDATION_DEDUP_REVIEW_THRESHOLD:-0.80}
      CORTEXIQ_CONSOLIDATION_WINDOW: 168h
      CORTEXIQ_DECAY_FACTOR: 0.95
      CORTEXIQ_EXPIRY_THRESHOLD: 0.1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/cortexiq", "env"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
