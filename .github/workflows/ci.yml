name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    # Real Postgres 17 + pgvector + pg_textsearch for the integration tests in
    # internal/brain, started by the composite action below (it needs the image from
    # deploy/postgres, so a service container cannot do it).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Postgres 17 with BM25
        uses: ./.github/actions/postgres-bm25
        with:
          database: cortexiq_test

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Reads the go directive from go.mod (currently 1.25.5).
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        env:
          CORTEXIQ_TEST_DSN: postgres://cortexiq:cortexiq@localhost:5432/cortexiq_test?sslmode=disable
        run: go test ./...

      # Coverage is measured with the database attached: without it the brain
      # package reports 26% instead of 67%, and the number would mean nothing.
      # The baseline only ratchets up. Raise it in the same pull request that
      # raises coverage.
      - name: Coverage (must not drop)
        env:
          CORTEXIQ_TEST_DSN: postgres://cortexiq:cortexiq@localhost:5432/cortexiq_test?sslmode=disable
        run: |
          go test ./... -count=1 -covermode=count -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')"
          baseline="$(tr -d '[:space:]' < .github/coverage-baseline.txt)"
          echo "total coverage: ${total}% (baseline ${baseline}%)"
          if ! awk -v t="${total}" -v b="${baseline}" 'BEGIN { exit !(t + 0.2 >= b) }'; then
            echo "FAIL: coverage ${total}% dropped below the baseline ${baseline}%"
            exit 1
          fi

      # Guard: the integration tests skip themselves without a database, which
      # would silently turn them into no-ops. Fail if any of them was skipped.
      - name: Integration tests ran (not skipped)
        env:
          CORTEXIQ_TEST_DSN: postgres://cortexiq:cortexiq@localhost:5432/cortexiq_test?sslmode=disable
        run: |
          go test -count=1 -v -run Integration ./internal/brain/ | tee integration.log
          if grep -q -- '--- SKIP' integration.log; then
            echo "Integration tests were skipped"; exit 1
          fi
          grep -c -- '--- PASS: TestIntegration' integration.log

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Postgres 17 with BM25
        uses: ./.github/actions/postgres-bm25
        with:
          database: cortexiq_test

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # The consolidation pipeline runs the reasoner and the embedder from
      # goroutines; a data race there corrupts memory silently, which is the one
      # failure mode this project cannot afford. Kept as its own job so a slow
      # race run never hides a plain test failure.
      - name: Test with the race detector
        env:
          CORTEXIQ_TEST_DSN: postgres://cortexiq:cortexiq@localhost:5432/cortexiq_test?sslmode=disable
        run: go test -race ./... -count=1
