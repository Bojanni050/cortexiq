name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    # Real Postgres + pgvector for the integration tests in internal/brain.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortexiq
          POSTGRES_PASSWORD: cortexiq
          POSTGRES_DB: cortexiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortexiq -d cortexiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Reads the go directive from go.mod (currently 1.25.5).
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        env:
          CORTEXIQ_TEST_DSN: postgres://cortexiq:cortexiq@localhost:5432/cortexiq_test?sslmode=disable
        run: go test ./...

      # Guard: the integration tests skip themselves without a database, which
      # would silently turn them into no-ops. Fail if any of them was skipped.
      - name: Integration tests ran (not skipped)
        env:
          CORTEXIQ_TEST_DSN: postgres://cortexiq:cortexiq@localhost:5432/cortexiq_test?sslmode=disable
        run: |
          go test -count=1 -v -run Integration ./internal/brain/ | tee integration.log
          if grep -q -- '--- SKIP' integration.log; then
            echo "Integration tests were skipped"; exit 1
          fi
          grep -c -- '--- PASS: TestIntegration' integration.log
