name: cortexiq

# Production template. Copy to docker-compose.prod.yml on the server and keep
# secrets in /opt/cortexiq/.env; never commit the real production file or secrets.
x-cortexiq-env: &cortexiq-env
  CORTEXIQ_POSTGRES_DSN: postgresql://cortexiq:${POSTGRES_PASSWORD}@postgres:5432/cortexiq?sslmode=disable
  CORTEXIQ_VECTOR_DIM: ${CORTEXIQ_VECTOR_DIM:-1024}
  CORTEXIQ_MAX_RESULT_SIZE: ${CORTEXIQ_MAX_RESULT_SIZE:-10000}
  CORTEXIQ_OPENAI_API_KEY: ${CORTEXIQ_OPENAI_API_KEY}
  CORTEXIQ_OPENAI_BASE_URL: ${CORTEXIQ_OPENAI_BASE_URL}
  CORTEXIQ_EMBEDDING_MODEL: ${CORTEXIQ_EMBEDDING_MODEL}
  CORTEXIQ_EMBEDDING_BASE_URL: ${CORTEXIQ_EMBEDDING_BASE_URL:-}
  CORTEXIQ_EMBEDDING_API_KEY: ${CORTEXIQ_EMBEDDING_API_KEY:-}
  CORTEXIQ_REASONER_MODEL: ${CORTEXIQ_REASONER_MODEL}
  CORTEXIQ_REASONER_MAX_TOKENS: ${CORTEXIQ_REASONER_MAX_TOKENS:-1024}
  CORTEXIQ_REASONER_JSON_MODE: ${CORTEXIQ_REASONER_JSON_MODE:-false}
  CORTEXIQ_MODEL_PRICES: ${CORTEXIQ_MODEL_PRICES:-}
  CORTEXIQ_CONTEXT_TTL: ${CORTEXIQ_CONTEXT_TTL:-1h}
  CORTEXIQ_HTTP_ADDR: :9090
  # Set CORTEXIQ_API_TOKEN (single) or CORTEXIQ_API_TOKENS (scoped JSON) in .env.
  CORTEXIQ_API_TOKEN: ${CORTEXIQ_API_TOKEN:-}
  CORTEXIQ_API_TOKENS: ${CORTEXIQ_API_TOKENS:-}
  CORTEXIQ_LOG_LEVEL: ${CORTEXIQ_LOG_LEVEL:-info}
  CORTEXIQ_LOG_FORMAT: ${CORTEXIQ_LOG_FORMAT:-text}
  CORTEXIQ_CONSOLIDATION_BATCH_SIZE: ${CORTEXIQ_CONSOLIDATION_BATCH_SIZE:-100}
  CORTEXIQ_CONSOLIDATION_SIMILARITY_THRESHOLD: ${CORTEXIQ_CONSOLIDATION_SIMILARITY_THRESHOLD:-0.85}
  CORTEXIQ_CONSOLIDATION_DEDUP_THRESHOLD: ${CORTEXIQ_CONSOLIDATION_DEDUP_THRESHOLD:-0.90}
  CORTEXIQ_CONSOLIDATION_DEDUP_REVIEW_THRESHOLD: ${CORTEXIQ_CONSOLIDATION_DEDUP_REVIEW_THRESHOLD:-0.80}
  CORTEXIQ_HYBRID_RECALL: ${CORTEXIQ_HYBRID_RECALL:-true}
  CORTEXIQ_RECALL_MIN_SIMILARITY: ${CORTEXIQ_RECALL_MIN_SIMILARITY:-0}
  CORTEXIQ_RECALL_RECENCY_WEIGHT: ${CORTEXIQ_RECALL_RECENCY_WEIGHT:-0}
  CORTEXIQ_RECALL_RECENCY_HALFLIFE: ${CORTEXIQ_RECALL_RECENCY_HALFLIFE:-168h}
  CORTEXIQ_RECALL_IMPORTANCE_WEIGHT: ${CORTEXIQ_RECALL_IMPORTANCE_WEIGHT:-0}
  CORTEXIQ_RELATIONSHIP_BATCH_SIZE: ${CORTEXIQ_RELATIONSHIP_BATCH_SIZE:-5}
  CORTEXIQ_MAX_LLM_CALLS_PER_RUN: ${CORTEXIQ_MAX_LLM_CALLS_PER_RUN:-50}
  CORTEXIQ_CONSOLIDATION_WINDOW: ${CORTEXIQ_CONSOLIDATION_WINDOW:-168h}
  CORTEXIQ_DECAY_FACTOR: ${CORTEXIQ_DECAY_FACTOR:-0.95}
  CORTEXIQ_EXPIRY_THRESHOLD: ${CORTEXIQ_EXPIRY_THRESHOLD:-0.1}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cortexiq
      POSTGRES_USER: cortexiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  cortexiq:
    build: .
    image: cortexiq:local
    command: ["mcp", "serve", "--host", "0.0.0.0", "--port", "8080", "--with-consolidation"]
    ports:
      - "127.0.0.1:18100:8080"
    environment: *cortexiq-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cortexiq-ui:
    image: cortexiq:local
    command: ["http", "serve", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "127.0.0.1:18101:9090"
    environment: *cortexiq-env
    depends_on:
      cortexiq:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
