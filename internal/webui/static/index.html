<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CortexIQ Dashboard</title>
<link rel="icon" type="image/png" href="/ui/brand/mark-96.png">
<meta name="theme-color" content="#0b0f0e">
<script>
try { const t = localStorage.getItem('cq.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
try { if (localStorage.getItem('cq.ctx') === 'closed') document.documentElement.classList.add('ctx-collapsed'); } catch (e) {}
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0f0e;
  --bg-soft: #0e1412;
  --panel: #131a17;
  --panel-2: #17201c;
  --panel-3: #1c2621;
  --border: #22302a;
  --border-2: #32423a;
  --fg: #edf2ee;
  --fg-2: #c5d2ca;
  --muted: #97a79e;
  --dim: #6b7c73;
  --accent: #3fa287;
  --accent-2: #96a14f;
  --accent-soft: rgba(63,162,135,.15);
  --accent-line: rgba(63,162,135,.42);
  --green: #4dc49a;
  --red: #e58279;
  --yellow: #d6ae5c;
  --blue: #74a9c7;
  --hover: rgba(255,255,255,.045);
  --hover-2: rgba(255,255,255,.075);
  --inset: rgba(255,255,255,.02);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --shadow: 0 1px 0 rgba(255,255,255,.035) inset, 0 10px 28px rgba(0,0,0,.22);
  --shadow-pop: 0 28px 80px rgba(0,0,0,.55);
  --nav-w: 264px;
  --ctx-w: 432px;
  --font: ui-sans-serif, "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --bg-image:
    radial-gradient(1000px 560px at 88% -12%, rgba(63,162,135,.10), transparent 62%),
    radial-gradient(760px 460px at -6% 108%, rgba(150,161,79,.06), transparent 60%);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f7f2;
  --bg-soft: #fbfcf9;
  --panel: #ffffff;
  --panel-2: #f3f7f2;
  --panel-3: #e9efe9;
  --border: #dde6dd;
  --border-2: #c9d5c9;
  --fg: #141d18;
  --fg-2: #3a473f;
  --muted: #5b6a61;
  --dim: #86958c;
  --accent: #14705f;
  --accent-2: #7c8738;
  --accent-soft: rgba(20,112,95,.09);
  --accent-line: rgba(20,112,95,.32);
  --green: #0f8a63;
  --red: #c1493f;
  --yellow: #a1721c;
  --blue: #2a6e8f;
  --hover: rgba(16,24,40,.04);
  --hover-2: rgba(16,24,40,.07);
  --inset: rgba(16,24,40,.02);
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 26px rgba(16,24,40,.05);
  --shadow-pop: 0 28px 80px rgba(16,24,40,.20);
  --bg-image:
    radial-gradient(900px 520px at 92% -14%, rgba(20,112,95,.07), transparent 60%),
    radial-gradient(700px 420px at -8% 106%, rgba(124,135,56,.06), transparent 58%);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
html { background: var(--bg); overflow-x: hidden; }
body {
  margin: 0; min-height: 100vh; overflow-x: hidden; font-family: var(--font); font-size: 16.5px; line-height: 1.6;
  color: var(--fg); background: var(--bg-image), var(--bg); background-attachment: fixed;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-soft); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }

/* ---------- shell ---------- */
.app {
  display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--ctx-w); min-height: 100vh;
  /* The context column opens and closes by animating its own track, so the page
     reflows smoothly instead of jumping when the rail is hidden. */
  transition: grid-template-columns .34s cubic-bezier(.22,.61,.36,1);
}

aside.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
  padding: 18px 12px 14px;
  background: var(--bg-soft); border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand .mark { width: 40px; height: 40px; flex: none; object-fit: contain; padding: 4px; border-radius: 12px; background: #f1f3e9; box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 6px 16px rgba(0,0,0,.28); }
html[data-theme="light"] .brand .mark { background: #fff; border: 1px solid var(--border); box-shadow: none; }
.brand b { font-size: 16px; letter-spacing: .085em; text-transform: uppercase; font-weight: 700; display: block; }
.brand small { display: block; color: var(--dim); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; margin-top: 2px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); padding: 0 9px 5px; font-weight: 600; }

.ns-picker { padding: 0 4px; }
#ns-select {
  width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; font: inherit; font-size: 14.5px;
}
#ns-select:disabled { opacity: .55; }
nav { display: flex; flex-direction: column; overflow-y: auto; padding: 0 2px 4px; }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup + .navgroup { margin-top: 12px; }
nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; color: var(--muted); padding: 8px 10px;
  border-radius: var(--radius-sm); cursor: pointer; font: inherit; font-size: 14.5px;
  font-weight: 500; position: relative; transition: background .15s, color .15s;
}
nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav button:hover { background: var(--hover); color: var(--fg); }
nav button.active { background: var(--accent-soft); color: var(--fg); }
nav button.active svg { color: var(--accent); }
.rail-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 6px 4px 0; }
.rail-foot .icon-btn { color: var(--muted); }
.rail-foot .theme-name { font-size: 12.5px; color: var(--dim); }

.page { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
  padding: 20px 30px 16px;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
}
.topbar .crumbs { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin-bottom: 5px; font-weight: 600; }
.topbar h1 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: -.025em; line-height: 1.2; }
.topbar p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; max-width: 70ch; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; padding-bottom: 2px; }
main { padding: 22px 30px 72px; width: 100%; min-width: 0; }
#loading { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: slide 1s infinite linear; display: none; }
@keyframes slide { from { background-position: -50% 0; } to { background-position: 150% 0; } }
#content { animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ---------- controls ---------- */
.toolbar { display: flex; gap: 9px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar input { flex: 1; min-width: 240px; }
.toolbar.filters { align-items: center; gap: 18px; margin-top: -4px; }
.toolbar.filters input { flex: none; min-width: 0; }
.toolbar.filters label { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; }
input, textarea, select {
  background: var(--panel); color: var(--fg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 13px; font: inherit; font-size: 15px;
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder, textarea::placeholder { color: var(--dim); }
input:focus, textarea:focus, select:focus, #ns-select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
button { font: inherit; }
.btn, .toolbar > button, .pager button, dialog .actions button, .actions button, .gactions .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--border-2);
  border-radius: var(--radius-sm); padding: 9px 15px; cursor: pointer; font-weight: 550;
  font-size: 14.5px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover, .toolbar > button:hover, .pager button:hover:not(:disabled), dialog .actions button:hover, .actions button:hover { background: var(--panel-3); border-color: var(--dim); }
.btn:disabled, .toolbar > button:disabled { opacity: .5; cursor: default; }
.pager button { padding: 6px 13px; }
.pager button:disabled { opacity: .4; cursor: default; }
button.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
  border-color: transparent !important; color: #fff !important;
  box-shadow: 0 6px 18px rgba(63,162,135,.26);
}
button.primary:hover { filter: brightness(1.07); }
button:active { transform: translateY(1px); }
button.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--border)); }
button.danger:hover { background: color-mix(in srgb, var(--red) 10%, var(--panel-2)); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--panel); border: 1px solid var(--border); color: var(--fg-2);
  border-radius: var(--radius-sm); padding: 9px 12px; cursor: pointer; font-size: 14px; font-weight: 500;
}
.icon-btn:hover { background: var(--panel-2); color: var(--fg); border-color: var(--border-2); }
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#ctx-toggle.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); color: var(--fg); }
#ctx-toggle.has-ctx::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ---------- stat tiles ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat {
  position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  transition: border-color .15s, transform .15s;
}
.stat:hover { border-color: var(--border-2); transform: translateY(-1px); }
.stat .ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 15px; color: var(--tone, var(--accent)); background: color-mix(in srgb, var(--tone, var(--accent)) 14%, transparent); }
.stat .ico svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.stat .num { font-size: 31px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .lbl { color: var(--muted); font-size: 13.5px; margin-top: 7px; }

/* ---------- cards & tables ---------- */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; }
.card > h3 { margin: 0; padding: 16px 20px; font-size: 15.5px; font-weight: 600; border-bottom: 1px solid var(--border); letter-spacing: -.01em; }
.card > p { padding: 0 20px; }
.card > .card-body { padding: 16px 20px; }
.card > .actions { padding: 0 20px 18px; margin-top: 0; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
.tablewrap, .card table { background: transparent; }
body > .app main > #content > .tablewrap, #content > .tablewrap {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 15.5px; vertical-align: top; }
th {
  color: var(--dim); font-weight: 650; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .07em; background: var(--panel-2); white-space: nowrap;
}
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--hover); }
tbody tr.rowlink { cursor: pointer; }
tbody tr.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
tr:last-child td { border-bottom: none; }
td.wrap { max-width: 760px; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; min-width: 215px; }
.tablewrap td.muted { white-space: nowrap; }
.muted { color: var(--muted); font-size: 14px; }
.mono { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: -.01em; }
.err { color: var(--red); }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 550; color: var(--badge-c, var(--muted));
  background: color-mix(in srgb, var(--badge-c, var(--muted)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--badge-c, var(--muted)) 26%, transparent);
  white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.active, .badge.confirmed { --badge-c: var(--green); }
.badge.completed { --badge-c: var(--blue); }
.badge.abandoned, .badge.rejected { --badge-c: var(--red); }
.badge.pending, .badge.proposed { --badge-c: var(--yellow); }
.badge.testing { --badge-c: var(--blue); }

/* ---------- tags, confidence, row actions ---------- */
.tagbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.tagchip {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  font: inherit; font-size: 13px; cursor: pointer; transition: all .15s;
}
.tagchip:hover { color: var(--fg); border-color: var(--border-2); }
.tagchip.on { background: rgba(150,161,79,.16); border-color: rgba(150,161,79,.45); color: var(--accent-2); }
.tagchip em { font-style: normal; opacity: .65; font-size: 11px; font-variant-numeric: tabular-nums; }
.taglegend { font-size: 11.5px; opacity: .5; }
.tagreport { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 11.5px; cursor: pointer; padding: 2px 4px; text-decoration: underline dotted; }
.tagreport:hover { color: var(--fg); }
.tr-quick { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 14px; }
td.tagcell { white-space: nowrap; }
.conf { display: inline-flex; align-items: center; gap: 9px; min-width: 92px; }
.conf i { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.conf i b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform-origin: left; }
.ctx .conf i { height: 6px; }
.ctx .conf i b { animation: confGrow .55s cubic-bezier(.22,.61,.36,1) both; }
@keyframes confGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.conf span { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; width: 38px; text-align: right; }
.row-actions { white-space: nowrap; }
.row-actions button {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: var(--radius-xs); padding: 4px 9px; margin-right: 3px; cursor: pointer;
  font: inherit; font-size: 13px; transition: all .15s;
}
.row-actions button:hover { color: var(--fg); border-color: var(--border-2); background: var(--panel-2); }
.row-actions button.danger:hover { color: var(--red); border-color: rgba(255,123,123,.4); }
.empty { padding: 52px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 28px; margin-bottom: 6px; opacity: .5; }
.empty.error { color: var(--red); }
.pager { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 4px 0; font-size: 14px; color: var(--muted); }
.pager .pages { display: flex; gap: 8px; margin-left: auto; }

/* ---------- context rail ---------- */
.ctx {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background: var(--bg-soft); border-left: 1px solid var(--border); min-width: 0; overflow: hidden;
  transition: opacity .24s ease, transform .34s cubic-bezier(.22,.61,.36,1), border-color .24s ease;
}
.ctx-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
.ctx-head h2 { margin: 4px 0 0; font-size: 17px; font-weight: 650; letter-spacing: -.015em; animation: ctxHead .3s cubic-bezier(.22,.61,.36,1) both; }
.ctx-head .icon-btn { padding: 6px; border-color: transparent; background: none; }
.ctx-head .icon-btn:hover { background: var(--hover); }
.ctx-body { padding: 20px; overflow-y: auto; overscroll-behavior: contain; flex: 1; }
/* Every direct child of the rail slides in on its own beat. innerHTML is
   replaced on each pick, so the animation replays for the new memory. */
.ctx-body > * { animation: ctxIn .38s cubic-bezier(.22,.61,.36,1) both; }
.ctx-body > *:nth-child(2) { animation-delay: .06s; }
.ctx-body > *:nth-child(3) { animation-delay: .12s; }
.ctx-body > *:nth-child(4) { animation-delay: .18s; }
.ctx-body > *:nth-child(5) { animation-delay: .24s; }
@keyframes ctxIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes ctxHead { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.ctx-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 42px 10px; color: var(--muted); font-size: 14.5px; }
.ctx-empty .glyph {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); margin-bottom: 14px;
}
.ctx-empty .glyph svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ctx-empty b { color: var(--fg-2); font-weight: 600; display: block; margin-bottom: 5px; font-size: 15px; }
.ctx-hint { margin-top: 20px; padding: 13px 15px; border: 1px dashed var(--border-2); border-radius: var(--radius-sm); font-size: 13.5px; color: var(--dim); text-align: left; width: 100%; }
.ctx-hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; color: var(--muted); }
.ctx-section { margin-top: 22px; }
.ctx-section:first-child { margin-top: 0; }
.ctx-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.ctx-section-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); font-weight: 650; }
.ctx-section-head .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctx-quote { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; font-size: 15.5px; }
.ctx-quote.lead { border-left: 3px solid var(--accent); }
/* Metadata that used to be table columns (tags, namespace, validity,
   confidence) lives here, one labelled row per property. */
.metagrid {
  display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 1px;
  margin: 0; background: var(--border); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.metagrid dt {
  display: flex; align-items: center; padding: 11px 12px; background: var(--panel-2);
  color: var(--dim); text-transform: uppercase; letter-spacing: .07em; font-size: 10.5px; font-weight: 650;
}
.metagrid dd {
  margin: 0; padding: 11px 13px; background: var(--panel); color: var(--fg-2);
  font-size: 14px; overflow-wrap: anywhere; display: flex; flex-direction: column;
  align-items: flex-start; gap: 6px;
}
.metagrid dd .conf { min-width: 0; width: 100%; align-self: stretch; }
.ctx-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ctx-tags .badge { font-size: 12.5px; }
.ctx-fact {
  display: block; width: 100%; text-align: left; background: var(--panel); color: inherit;
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; margin-bottom: 8px;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.ctx-fact:hover { border-color: var(--border-2); background: var(--panel-2); }
.ctx-fact .body { font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.ctx-fact .meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
.ctx-fact .meta .mono { font-size: 11.5px; }
.ctx-fact .meta .spacer { flex: 1; }
.ctx-note { font-size: 13.5px; color: var(--dim); line-height: 1.55; margin-top: 12px; }
.ctx-link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 13.5px; }
.ctx-link:hover { text-decoration: underline; }
.skeleton { border-radius: 10px; background: linear-gradient(90deg, var(--panel) 25%, var(--panel-3) 37%, var(--panel) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; height: 13px; margin-bottom: 10px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* ---------- dialog & toast ---------- */
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--border-2); border-radius: 18px; padding: 24px; max-width: 520px; width: 92%; box-shadow: var(--shadow-pop); }
dialog::backdrop { background: rgba(5,7,12,.62); backdrop-filter: blur(3px); }
dialog h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.02em; }
dialog label, dialog .label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; padding: 0; text-transform: none; letter-spacing: 0; font-weight: 500; }
dialog input, dialog textarea, dialog select { width: 100%; }
dialog textarea { min-height: 78px; resize: vertical; }
.cfg-input { font-family: var(--mono); font-size: 12.5px; }
.cfg-input::placeholder { color: var(--dim); font-family: inherit; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
dialog .err { color: var(--red); }
#toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 12px;
  background: var(--panel-3); border: 1px solid var(--border-2); border-left: 3px solid var(--green);
  box-shadow: var(--shadow-pop); display: none; z-index: 100; max-width: 380px; font-size: 13.5px;
}
#toast.err { border-left-color: var(--red); }

/* ---------- rendered markdown (mental model content) ---------- */
.md { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 6px; line-height: 1.3; letter-spacing: -.01em; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.md pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow: auto; margin: 10px 0; }
.md pre code { background: none; border: 0; padding: 0; }
.md table { border-collapse: collapse; margin: 10px 0; width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--panel-2); }
.md blockquote { margin: 10px 0; padding: 2px 12px; border-left: 3px solid var(--border-2); color: var(--muted); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.md img { max-width: 100%; }

/* ---------- graph ---------- */
.gmeta { color: var(--muted); font-size: 12.5px; margin: -4px 0 10px; }
.gmeta b { color: var(--fg); }
.gwrap { position: relative; }
#cy {
  height: calc(100vh - 260px); min-height: 500px; border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  background: radial-gradient(900px 520px at 30% 20%, rgba(63,162,135,.09), transparent 60%), radial-gradient(700px 400px at 85% 90%, rgba(150,161,79,.06), transparent 60%), var(--bg-soft);
}
.gpanel {
  position: absolute; top: 12px; right: 12px; width: 330px; max-height: calc(100% - 24px); overflow-y: auto;
  padding: 16px; background: color-mix(in srgb, var(--panel) 96%, transparent);
  backdrop-filter: blur(10px); border: 1px solid var(--border-2); border-radius: var(--radius);
  box-shadow: var(--shadow-pop); animation: fade .2s ease;
}
.gpanel[hidden] { display: none; }
.gpanel h4 { margin: 0 24px 4px 0; font-size: 15px; line-height: 1.35; letter-spacing: -.01em; word-break: break-word; }
.gx { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
.gx:hover { color: var(--fg); }
.gactions { margin: 12px 0 8px; }
.gactions .btn { padding: 6px 12px; font-size: 12.5px; }
.glist { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.grow { padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; word-break: break-word; }
.grow:hover { background: var(--hover); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; color: var(--fg); background: color-mix(in srgb, var(--c) 22%, transparent); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
.gkv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 13px; }
.gkv span:nth-child(odd) { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.gquote { margin-top: 2px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--hover); border-radius: 0 8px 8px 0; color: var(--fg); font-size: 13px; }
.gsrc { margin-top: 14px; }
.glegend { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 370px); display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  font: inherit; font-size: 11.5px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--border-2);
  cursor: pointer; backdrop-filter: blur(6px);
}
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.chip:hover:not(:disabled) { color: var(--fg); border-color: var(--dim); }
.chip.on { color: var(--fg); border-color: var(--accent); background: var(--accent-soft); }
.chip:disabled { cursor: default; }

/* ---------- responsive ---------- */
@media (max-width: 1360px) {
  .app { grid-template-columns: 236px minmax(0, 1fr); }
  .ctx {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw); z-index: 70;
    transform: translateX(102%); opacity: 0; box-shadow: var(--shadow-pop);
    transition: transform .34s cubic-bezier(.22,.61,.36,1), opacity .24s ease, border-color .24s ease;
    visibility: hidden;
  }
  body.ctx-open .ctx { transform: none; opacity: 1; visibility: visible; }
  #ctx-scrim { position: fixed; inset: 0; z-index: 65; background: rgba(4,6,12,.5); display: none; }
  body.ctx-open #ctx-scrim { display: block; }
}
@media (min-width: 1361px) {
  html.ctx-collapsed .app { grid-template-columns: var(--nav-w) minmax(0, 1fr) 0px; }
  html.ctx-collapsed .ctx {
    opacity: 0; transform: translateX(30px); pointer-events: none; border-left-color: transparent;
  }
}
@media (max-width: 1000px) and (min-width: 861px) {
  .rail { --nav-w: 236px; }
  nav button span { display: none; }
  .navgroup .label { text-align: center; padding-left: 0; padding-right: 0; }
  nav button { justify-content: center; padding: 10px; }
  .brand { justify-content: center; padding: 0; }
  .brand > div:last-child { display: none; }
  .ns-picker .label { display: none; }
  .rail-foot { justify-content: center; }
  .theme-name { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside.rail {
    position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 10px 14px 6px; border-right: 0; border-bottom: 1px solid var(--border); overflow: visible;
  }
  .brand { padding: 0; flex: none; order: 1; }
  .brand > div:last-child { display: none; }
  .ns-picker { flex: 0 1 210px; min-width: 0; padding: 0; order: 2; }
  .rail { width: 100%; max-width: 100vw; }
  .ns-picker .label { display: none; }
  #ns-select { padding: 8px 10px; font-size: 12.5px; }
  nav { order: 3; flex: 1 1 100%; width: 100%; min-width: 0; flex-direction: row; gap: 4px; overflow-x: auto; padding: 0 0 4px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .navgroup { flex-direction: row; gap: 4px; }
  .navgroup + .navgroup { margin-top: 0; }
  .navgroup .label { display: none; }
  nav button { width: auto; padding: 7px 10px; font-size: 13px; }
  nav button span { display: inline; }
  .rail-foot { margin: 0; padding: 0; order: 2; margin-left: auto; }
  .theme-name { display: none; }
  .topbar { padding: 16px 18px 14px; align-items: center; }
  .topbar h1 { font-size: 19px; }
  .topbar p { display: none; }
  main { padding: 16px 18px 64px; }
  .gpanel { position: static; width: auto; margin-top: 10px; }
  .glegend { position: static; max-width: none; margin-top: 10px; }
  #cy { height: 62vh; }
}

.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  .app, .ctx, .ctx-body > *, .ctx-head h2, .ctx .conf i b { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><img class="mark" src="/ui/brand/mark-96.png" alt="" width="38" height="38"><div><b>CortexIQ</b><small>AI Memory System</small></div></div>
    <div class="ns-picker">
      <label class="label" for="ns-select">Namespace</label>
      <select id="ns-select" onchange="setNamespace(this.value)"></select>
    </div>
    <nav id="nav" aria-label="Browse"></nav>
    <div class="rail-foot">
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Switch between light and dark" aria-label="Switch theme"></button>
      <span class="theme-name">Dark</span>
    </div>
  </aside>
  <div class="page">
    <header class="topbar">
      <div>
        <div class="crumbs" id="crumbs">Memory</div>
        <h1 id="page-title">Overview</h1>
        <p id="page-sub"></p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="ctx-toggle" onclick="toggleCtx()" aria-label="Hide context" aria-pressed="true" title="Show or hide the context column">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
          <span>Hide context</span>
        </button>
      </div>
    </header>
    <div id="loading"></div>
    <main><div id="content"></div></main>
  </div>
  <aside class="ctx" id="ctx" aria-label="Context">
    <div class="ctx-head">
      <div><div class="label" style="padding:0">Context</div><h2 id="ctx-title">Nothing selected</h2></div>
      <button class="icon-btn" onclick="hideCtx()" aria-label="Hide context column">×</button>
    </div>
    <div class="ctx-body" id="ctx-body"></div>
  </aside>
</div>
<div id="ctx-scrim" onclick="closeCtx()"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const API = '/api/v1';
const state = { tab: 'overview', ns: '', nsMap: {}, page: {}, filter: {}, lists: {}, tags: [], tagVocab: [], mmBusy: new Set(), ctxTab: null };

const icons = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  episodes: '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  recall: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  facts: '<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  goals: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  mental: '<path d="M12 3a8 8 0 0 0-8 8c0 2.5 1.2 4.7 3 6.2V21h10v-3.8c1.8-1.5 3-3.7 3-6.2a8 8 0 0 0-8-8z"/><path d="M9 12h.01M15 12h.01M9.5 15.5c.7.5 1.6.8 2.5.8s1.8-.3 2.5-.8"/>',
  hypotheses: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/>',
  contradictions: '<path d="m13 2-9 12h7l-1 8 9-12h-7z"/>',
  failures: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  graph: '<circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="8" r="2.6"/><circle cx="9" cy="18" r="2.6"/><path d="M8.4 6.4l7.1 1.2M7.2 8.3l1.1 7.3M16.6 10.2l-5.7 6.1"/>',
  links: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  namespaces: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  runs: '<path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  metrics: '<path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/>',
  lifecycle: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>',
  stats: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
};
const svg = k => `<svg viewBox="0 0 24 24">${icons[k]}</svg>`;

const tabs = [
  ['overview', 'Overview', 'A snapshot of what this memory knows'],
  ['episodes', 'Episodes', 'Raw memories, before they are consolidated into facts'],
  ['recall', 'Recall', 'Search the memory and see how each result was ranked'],
  ['facts', 'Facts', 'Stored facts — open one for its tags, validity and confidence'],
  ['graph', 'Graph', 'How entities relate: the knowledge graph (drag, zoom, click for details)'],
  ['goals', 'Goals', 'What the agent is working towards'],
  ['mental', 'Mental Models', 'Curated summaries searched first in reflect'],
  ['hypotheses', 'Hypotheses', 'Unverified beliefs waiting for evidence'],
  ['contradictions', 'Contradictions', 'Facts that disagree with each other'],
  ['failures', 'Failures', 'What went wrong, and what was learned'],
  ['links', 'Causal Links', 'Cause and effect between facts'],
  ['namespaces', 'Namespaces', 'How memory is organised'],
  ['runs', 'Runs', 'Recent consolidation runs and what changed'],
  ['lifecycle', 'Lifecycle', 'What was retracted and what was purged, newest first'],
  ['settings', 'Settings', 'When new memories are consolidated into facts'],
  ['metrics', 'Metrics', 'Runtime, consolidation and LLM usage metrics'],
  ['stats', 'Stats', 'What the memory store holds: totals, size and date range'],
];
// The list is long enough that one flat column reads as a wall. Grouping by the
// question a reader has ("what is stored", "what does it believe", "is it
// healthy") keeps every tab reachable without a second click.
const NAV_GROUPS = [
  ['Memory', ['overview', 'episodes', 'facts', 'recall']],
  ['Knowledge', ['graph', 'mental', 'goals', 'hypotheses', 'contradictions', 'failures', 'links']],
  ['System', ['namespaces', 'runs', 'lifecycle', 'settings', 'metrics', 'stats']],
];
const nav = document.getElementById('nav');
NAV_GROUPS.forEach(([group, ids]) => {
  const wrap = document.createElement('div');
  wrap.className = 'navgroup';
  wrap.innerHTML = `<div class="label">${group}</div>`;
  ids.forEach(id => {
    const t = tabs.find(x => x[0] === id);
    if (!t) return;
    const b = document.createElement('button');
    b.dataset.tab = id;
    b.title = t[1] + ' — ' + t[2];
    b.innerHTML = svg(id) + `<span>${t[1]}</span>`;
    b.onclick = () => {
      state.tab = id;
      if (location.hash.slice(1) !== id) location.hash = id;
      refresh();
    };
    wrap.appendChild(b);
  });
  nav.appendChild(wrap);
});
function tabGroup(id) {
  const g = NAV_GROUPS.find(x => x[1].includes(id));
  return g ? g[0] : 'Memory';
}

function toast(msg, err) {
  const t = document.getElementById('toast');
  // A modal <dialog> lives in the browser's top layer, above every z-index, so a
  // toast left in the body is painted under the dialog's blurred backdrop and
  // cannot be read. Park it inside the open dialog: it is position: fixed, so it
  // still sits in the viewport corner, but now above the backdrop.
  const dlg = document.getElementById('dlg');
  (dlg && dlg.open ? dlg : document.body).appendChild(t);
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
}

const TOKEN_KEY = 'cortexiq_token';
// The namespace is part of the view, not of the URL: keep it across reloads so
// returning to the dashboard lands where the reader left off.
const NS_KEY = 'cortexiq_ns';
function rememberNS(ns) { try { localStorage.setItem(NS_KEY, ns); } catch (e) {} }
function readStoredNS() { try { return localStorage.getItem(NS_KEY) || ''; } catch (e) { return ''; } }

function readToken() {
  try {
    return localStorage.getItem(TOKEN_KEY) || '';
  } catch (e) { return ''; }
}

function authHeaders() {
  const t = readToken();
  return t ? {'Authorization': 'Bearer ' + t} : {};
}
// request sends one call and answers with the raw Response, retrying once after
// asking for a token. Everything that needs a header (X-Total-Count) goes
// through here.
async function request(path, opts, retried) {
  opts = opts || {};
  const res = await fetch(API + path, Object.assign({}, opts, {
    headers: Object.assign({'Content-Type': 'application/json'}, authHeaders(), opts.headers || {})
  }));
  if (res.status === 401 && !retried) {
    const t = prompt('This CortexIQ server requires an API token (CORTEXIQ_API_TOKEN):');
    if (t) {
      try { localStorage.setItem(TOKEN_KEY, t.trim()); } catch (e) {}
      return request(path, opts, true);
    }
  }
  return res;
}
async function api(path, opts) {
  const res = await request(path, opts);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || res.statusText);
  return body;
}
// Endpoints return either a bare array, {items: [...]}, or null; always hand back an array.
function listOf(body) {
  if (Array.isArray(body)) return body;
  if (body && Array.isArray(body.items)) return body.items;
  return [];
}
async function apiList(path) { return listOf(await api(path)); }

// apiPage is apiList plus the real row count, which every list endpoint reports
// in X-Total-Count. Without it the dashboard silently stops at the first page:
// 1,240 facts would look like 1,000.
async function apiPage(path) {
  const res = await request(path);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || res.statusText);
  const n = Number(res.headers.get('X-Total-Count'));
  return {items: listOf(body), total: Number.isFinite(n) && n >= 0 ? n : null};
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ts(s) { return s ? new Date(s).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : ''; }
function nsSlug(id) { return id == null ? 'global' : (state.nsMap[id] || ('#' + id)); }
function pct(v) { const n = Math.max(0, Math.min(1, Number(v) || 0)); return `<div class="conf"><i><b style="width:${n * 100}%"></b></i><span>${(n * 100).toFixed(0)}%</span></div>`; }
function bytes(n) {
  n = Number(n) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
}

async function loadNamespaces() {
  const list = await apiList('/namespaces?limit=1000');
  const sel = document.getElementById('ns-select');
  sel.innerHTML = '<option value="/">All namespaces (/)</option>' +
    list.map(n => `<option value="${esc(n.slug)}">${esc(n.slug)}</option>`).join('');
  const wanted = state.ns || readStoredNS();
  // A namespace that no longer exists falls back to the first option ("/").
  if (wanted && (wanted === '/' || list.some(n => n.slug === wanted))) sel.value = wanted;
  list.forEach(n => state.nsMap[n.id] = n.slug);
  state.ns = sel.value;
  state.nsLoaded = true;
  rememberNS(state.ns);
  // The rail is painted before the namespace list arrives on first load; once
  // the slug is known, replace the empty line in the hint.
  if (!ctx.kind) ctxIdle();
}
function setNamespace(ns) {
  state.ns = ns;
  state.page = {};
  // Tags are a property of the memories in a namespace, so a different
  // namespace starts without a tag filter rather than inheriting a tag that may
  // not exist there.
  state.tags = [];
  state.tagVocab = [];
  state.ctxTab = null;
  rememberNS(ns);
  refresh();
}

function toolbar(html) { return `<div class="toolbar">${html}</div>`; }
function table(headers, rows) {
  if (!rows.length) return '<div class="empty"><div class="big">∅</div>Nothing here yet</div>';
  return `<div class="tablewrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
// A list tab shows one page at a time. The API caps limit at 1000 and takes an
// offset, so paging is entirely a UI concern.
const PAGE = 100;

// qs builds the query for one page of a list: the current namespace, the page
// size, the offset and any extra filters that tab needs.
function qs(offset, extra) { return nsQS('&limit=' + PAGE + '&offset=' + offset + (extra || '')); }

// nsQS is the namespace-scoped part of a request, for the few fetches that are
// not one page of a list (the filter enrichments, the namespace counts).
function nsQS(extra) { return '?namespaces=' + encodeURIComponent(state.ns) + (extra || ''); }

// ago renders a timestamp as "3 minutes ago", so the overview can say when
// extraction last ran without the reader doing arithmetic.
function ago(iso) {
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  const units = [[31536000, 'year'], [2592000, 'month'], [604800, 'week'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
  for (const [secs, name] of units) {
    if (s >= secs) {
      const n = Math.round(s / secs);
      return n + ' ' + name + (n === 1 ? '' : 's') + ' ago';
    }
  }
  return 'just now';
}

// listTab fetches one page for a list tab and hands it to paintTab. spec:
//   path(offset)  the request for this page
//   headers       table headers
//   fields        item properties the client-side filter looks at
//   row(item)     one <tr>
//   actions       optional extra buttons for the toolbar
//   enrich()      optional extra data the rows need (set up in the closure)
async function listTab(tab, spec) {
  const offset = state.page[tab] || 0;
  const page = await apiPage(spec.path(offset));
  // enrich runs after the page and receives its rows: a label lookup needs the
  // ids that are actually on screen (causal links point at arbitrary facts), and
  // guessing which ones to preload cost a second request and got it wrong.
  const aux = spec.enrich ? await spec.enrich(page.items) : null;
  state.lists[tab] = {items: page.items, total: page.total, offset: offset, spec: spec, aux: aux};
  paintTab(tab);
}

// paintTab filters the page on screen and draws it with a pager that tells the
// truth about what is shown. The filter box sits outside the region that gets
// replaced, so typing keeps the caret where it was.
function paintTab(tab) {
  const L = state.lists[tab];
  if (!L) return;
  const term = (state.filter[tab] || '').trim().toLowerCase();
  const rows = L.items.filter(it => !term || L.spec.fields.some(k => String(it[k] == null ? '' : it[k]).toLowerCase().includes(term)));
  const from = L.items.length ? L.offset + 1 : 0;
  const to = L.offset + L.items.length;
  const total = L.total;
  const counts = total == null
    ? 'showing ' + from + '–' + to
    : 'showing ' + from + '–' + to + ' of ' + total.toLocaleString();
  const onPage = term ? ' · ' + rows.length + ' of these match “' + esc(term) + '” on this page' : '';
  const hasPrev = L.offset > 0;
  const hasNext = total == null ? L.items.length === PAGE : L.offset + L.items.length < total;
  const pager = (hasPrev || hasNext || term) ? `<div class="pager">
      <span>${counts}${onPage}</span>
      <span class="pages">
        <button onclick="goPage('${tab}', -1)"${hasPrev ? '' : ' disabled'}>‹ Prev</button>
        <button onclick="goPage('${tab}', 1)"${hasNext ? '' : ' disabled'}>Next ›</button>
      </span>
    </div>` : '';
  let host = document.getElementById('list-' + tab);
  if (!host) {
    document.getElementById('content').innerHTML = toolbar((L.spec.actions || '') +
      `<input id="f-${tab}" placeholder="Filter these rows…" value="${esc(state.filter[tab] || '')}" oninput="setFilter('${tab}', this.value)">`) +
      `<div id="above-${tab}">${L.spec.above || ''}</div>` +
      `<div id="list-${tab}"></div>`;
    host = document.getElementById('list-' + tab);
  } else if (L.spec.above != null) {
    // The tag bar changes when the filter changes; repaint it in place so the
    // table below is not rebuilt for a chip click.
    const above = document.getElementById('above-' + tab);
    if (above && above.dataset.html !== L.spec.above) {
      above.dataset.html = L.spec.above;
      above.innerHTML = L.spec.above;
    }
  }
  // A poll that returns the same page must not rebuild the table: replacing
  // identical rows is what made the list flicker under the background refresh.
  const html = table(L.spec.headers, rows.map(r => L.spec.row(r, L))) + pager;
  if (host.dataset.html === html) return;
  host.dataset.html = html;
  host.innerHTML = html;
}

function setFilter(tab, v) {
  state.filter[tab] = v;
  paintTab(tab);
}
function goPage(tab, delta) {
  const L = state.lists[tab];
  if (!L) return;
  state.page[tab] = Math.max(0, L.offset + delta * PAGE);
  refresh();
}

function badge(v) { return v ? `<span class="badge ${esc(v)}">${esc(v)}</span>` : ''; }

// --- tags -------------------------------------------------------------------
// The active tag set is AND: every selected tag must be present. It is applied
// by the server (list endpoints and recall both accept `tags`), so it narrows
// the whole result set and the totals, not just the rows currently on screen.
function tagQS() { return state.tags.length ? '&tags=' + encodeURIComponent(state.tags.join(',')) : ''; }

function tagChips(tags) {
  return (tags || []).map(t => `<button class="tagchip" title="Narrow to ${esc(t)}" onclick="toggleTag('${esc(t)}')">${esc(t)}</button>`).join(' ');
}

// tagCountLabel splits the total into what it is made of. A single number here
// is ambiguous: on the Episodes tab a chip reading 7 looked like seven episodes
// while it meant six facts and one episode.
function tagCountLabel(t) {
  const f = Number(t.facts) || 0;
  const e = Number(t.episodes) || 0;
  if (f && e) return `${f}f · ${e}e`;
  if (f) return `${f}f`;
  if (e) return `${e}e`;
  return '0';
}

// tagBarHTML renders the vocabulary from state.tagVocab. Counts are unfiltered,
// so they say how much switching a tag on would show.
function tagBarHTML() {
  const vocab = state.tagVocab || [];
  if (!vocab.length) return '';
  const chips = vocab.map(t => {
    const on = state.tags.includes(t.tag);
    const title = `${t.facts} fact${t.facts === 1 ? '' : 's'}, ${t.episodes} episode${t.episodes === 1 ? '' : 's'} — click to filter`;
    return `<button class="tagchip${on ? ' on' : ''}" title="${esc(title)}" onclick="toggleTag('${esc(t.tag)}')">${esc(t.tag)}<em>${tagCountLabel(t)}</em></button>`;
  }).join('');
  const clear = state.tags.length ? `<button class="tagchip" onclick="clearTags()">clear ✕</button>` : '';
  const hint = state.tags.length ? `<span class="muted">${state.tags.length > 1 ? 'all of these tags' : 'this tag'}</span>` : '';
  return `<div class="tagbar" data-tagbar>${chips}${clear}${hint}<span class="taglegend">f = facts · e = episodes</span><button class="tagreport" onclick="tagsReport()" title="Count tags over a period instead of filtering by them">counts by period</button></div>`;
}

// isoDay speaks the YYYY-MM-DD the API accepts, in local time: a UTC date would
// show the previous day for the first hours of every morning.
function isoDay(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return isoDay(d);
}
function monthStart() {
  const d = new Date();
  return isoDay(new Date(d.getFullYear(), d.getMonth(), 1));
}

// monthsSince turns the report's lower bound into a window length, so the trend
// below the table covers the same period the table counts. Without a bound the
// window is a year.
function monthsSince(since) {
  if (!since) return 12;
  const d = new Date(since + 'T00:00:00');
  if (isNaN(d.getTime())) return 12;
  const now = new Date();
  const n = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth()) + 1;
  return Math.max(1, Math.min(n, 60));
}

// tagTrendChart draws one row of bars per tag over the months. Small multiples
// rather than grouped or stacked bars: with six tags and twelve months a single
// group per month is unreadable, and stacking facts on episodes hides the split
// this whole feature exists to show.
function tagTrendChart(trend) {
  if (!trend || !trend.length) return '';
  const months = [...new Set(trend.map(p => p.month))].sort();
  const totals = new Map();
  for (const p of trend) totals.set(p.tag, (totals.get(p.tag) || 0) + p.total);
  const tags = [...totals.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(e => e[0]);
  const byKey = new Map(trend.map(p => [p.tag + '|' + p.month, p]));
  const max = Math.max(1, ...trend.filter(p => tags.includes(p.tag)).map(p => p.total));

  const labelW = 92, barW = 11, gap = 3, rowH = 30;
  const width = labelW + months.length * (barW + gap);
  const height = tags.length * rowH + 16;
  const rows = tags.map((tag, i) => {
    const bars = months.map((m, j) => {
      const p = byKey.get(tag + '|' + m);
      const v = p ? p.total : 0;
      const h = v ? Math.max(2, Math.round((v / max) * (rowH - 8))) : 0;
      const x = labelW + j * (barW + gap);
      const y = i * rowH + (rowH - 4) - h;
      const tip = `${tag} · ${m}: ${v}${p ? ` (${p.facts}f, ${p.episodes}e)` : ''}`;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="1.5" fill="${v ? 'var(--accent-2)' : 'transparent'}"><title>${esc(tip)}</title></rect>`;
    }).join('');
    return `<text x="0" y="${i * rowH + 15}" fill="var(--muted)" font-size="11">${esc(tag)}</text>${bars}`;
  }).join('');
  // Label every third month, plus the last one: twelve labels do not fit.
  const axis = months.map((m, j) => (j % 3 === 0 || j === months.length - 1)
    ? `<text x="${labelW + j * (barW + gap)}" y="${tags.length * rowH + 11}" fill="var(--muted)" font-size="9">${esc(m.slice(2))}</text>`
    : '').join('');
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Tag trend per month">${rows}${axis}</svg>`;
}

// tagsReport answers "how many decisions this month?". It is a report and not a
// filter on purpose: the chips above keep filtering all-time rows (the episodes
// list has no since-bounded path), so a period on the chips would count rows
// that clicking the chip does not show. since === '' means all time.
async function tagsReport(since) {
  if (since === undefined) since = monthStart();
  let rows, trend;
  const months = monthsSince(since);
  try {
    [rows, trend] = await Promise.all([
      apiList('/tags' + nsQS('&limit=500' + (since ? '&since=' + encodeURIComponent(since) : ''))),
      apiList('/tags/timeline' + nsQS('&months=' + months)),
    ]);
  } catch (e) {
    toast('Could not load tag counts: ' + e.message, true);
    return;
  }
  const body = rows.length
    ? rows.map(t => `<tr><td>${esc(t.tag)}</td><td>${t.facts}</td><td>${t.episodes}</td><td>${t.total}</td></tr>`).join('')
    : '<tr><td colspan="4" class="muted">No tagged memories in this period.</td></tr>';
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>Tag counts</h3>
    <p class="muted" style="margin:0 0 12px">${state.ns ? esc(state.ns) : 'all namespaces'} — memories stored ${since ? 'on or after ' + esc(since) : 'at any time'}.</p>
    <input type="date" id="tr-since" value="${esc(since)}" max="${isoDay(new Date())}" onchange="tagsReport(this.value)">
    <div class="tr-quick">
      <button class="tagchip" onclick="tagsReport(daysAgo(7))">7 days</button>
      <button class="tagchip" onclick="tagsReport(daysAgo(30))">30 days</button>
      <button class="tagchip" onclick="tagsReport(daysAgo(90))">90 days</button>
      <button class="tagchip" onclick="tagsReport(monthStart())">this month</button>
      <button class="tagchip${since ? '' : ' on'}" onclick="tagsReport('')">all time</button>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Tag</th><th>Facts</th><th>Episodes</th><th>Total</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="muted" style="margin:12px 0 0;font-size:12px">One memory can carry several tags, so this table does not add up to a unique memory count.</p>
    ${trend.length ? `<h4 style="margin:18px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Trend · last ${months} month${months === 1 ? '' : 's'}</h4><div class="tablewrap">${tagTrendChart(trend)}</div>
    <p class="muted" style="margin:6px 0 0;font-size:12px">Hover a bar for that month's facts and episodes.</p>` : ''}
    <div class="actions"><button onclick="dlgClose()">Close</button></div>`;
  d.style.maxWidth = '560px';
  if (!d.open) d.showModal();
}

// tagBar fetches the namespace's tag vocabulary and returns the rendered bar.
// The vocabulary is kept in state so a toggle can repaint in place on tabs that
// must not refetch (recall).
async function tagBar() {
  state.tagVocab = await apiList('/tags' + nsQS('&limit=100'));
  return tagBarHTML();
}

function repaintTagBars() {
  document.querySelectorAll('[data-tagbar]').forEach(el => { el.innerHTML = tagBarHTML(); });
}

function toggleTag(t) {
  const i = state.tags.indexOf(t);
  if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t);
  // Recall is a snapshot: narrowing it should not wipe the query and results the
  // reader is looking at. Lists do refetch, because their pages and totals change.
  if (state.tab === 'recall') { repaintTagBars(); return; }
  state.page[state.tab] = 0;
  refresh();
}

function clearTags() {
  state.tags = [];
  if (state.tab === 'recall') { repaintTagBars(); return; }
  state.page[state.tab] = 0;
  refresh();
}
/* ---------- theme ---------- */
const THEME_KEY = 'cq.theme';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  const b = document.getElementById('theme-toggle');
  if (b) b.innerHTML = t === 'light' ? ICON_MOON : ICON_SUN;
  const n = document.querySelector('.theme-name');
  if (n) n.textContent = t === 'light' ? 'Light' : 'Dark';
  if (state.tab === 'graph' && state.cy) renderGraph();
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
}
applyTheme(document.documentElement.dataset.theme || 'dark');

/* ---------- context rail ---------- */
// The right column answers one question at a time about one memory: what did
// this episode become, and where did this fact come from. It is deliberately
// separate from the table so opening a row never loses the list underneath.
const ctx = { req: 0, kind: '', id: 0 };
const CTX_SKELETON = `<div class="skeleton" style="width:58%"></div>
  <div class="skeleton" style="height:66px"></div>
  <div class="skeleton" style="width:86%"></div>
  <div class="skeleton" style="width:74%"></div>
  <div class="skeleton" style="width:44%;margin-top:24px"></div>
  <div class="skeleton"></div>
  <div class="skeleton" style="width:90%"></div>`;
const CTX_TIPS = {
  overview: ['Nothing selected', 'Pick an episode or fact from a list and its details land here.'],
  episodes: ['Pick an episode', 'Its tags, namespace and timestamps show up here, plus the facts consolidated from it.'],
  facts: ['Pick a fact', 'Its tags, namespace, validity and confidence show up here, with the episodes it came from.'],
  recall: ['Nothing selected', 'Select a result to inspect the memory behind it.'],
  graph: ['Nothing selected', 'Click a node or an edge in the graph to inspect it.'],
  settings: ['No row detail', 'Settings apply to the whole installation; the controls live in the middle column.'],
  metrics: ['No row detail', 'A summary view; the numbers are in the middle column.'],
  stats: ['No row detail', 'A summary of what the store holds, in the middle column.'],
};

function ctxTitle(t) { document.getElementById('ctx-title').textContent = t; }
function ctxShow(html, title) {
  if (title) ctxTitle(title);
  const body = document.getElementById('ctx-body');
  body.innerHTML = html;
  body.scrollTop = 0;
  // The title only changes its text, so restart its entrance animation by hand.
  const head = document.getElementById('ctx-title');
  head.style.animation = 'none';
  void head.offsetWidth;
  head.style.animation = '';
}
function ctxIdle() {
  const t = tabs.find(x => x[0] === state.tab) || tabs[0];
  const tip = CTX_TIPS[state.tab] || ['Nothing selected', 'Pick a row to see its details here.'];
  ctx.kind = '';
  ctx.id = 0;
  ctxTitle(tip[0]);
  document.getElementById('ctx-body').innerHTML = `<div class="ctx-empty">
    <div class="glyph">${svg(state.tab)}</div>
    <div><b>${esc(t[1])}</b>${esc(tip[1])}</div>
    <div class="ctx-hint"><div class="mono" style="margin-bottom:6px">${esc(state.ns || '/')}</div>${esc(t[2])}</div>
  </div>`;
}
const CTX_KEY = 'cq.ctx';
function ctxWide() { return window.matchMedia('(min-width: 1361px)').matches; }
function ctxCollapsed() { return document.documentElement.classList.contains('ctx-collapsed'); }
function setCtxCollapsed(v) {
  document.documentElement.classList.toggle('ctx-collapsed', v);
  try { localStorage.setItem(CTX_KEY, v ? 'closed' : 'open'); } catch (e) {}
}
function syncCtxToggle() {
  const b = document.getElementById('ctx-toggle');
  if (!b) return;
  const open = ctxWide() ? !ctxCollapsed() : document.body.classList.contains('ctx-open');
  b.classList.toggle('on', open);
  b.setAttribute('aria-pressed', open ? 'true' : 'false');
  b.setAttribute('aria-label', open ? 'Hide context' : 'Show context');
  const label = b.querySelector('span');
  if (label) label.textContent = open ? 'Hide context' : 'Context';
}
// A row click never forces the column back open: if it is collapsed, the toggle
// grows a dot so the detail is there when you want it.
function revealCtx() {
  const b = document.getElementById('ctx-toggle');
  if (ctxWide()) {
    if (ctxCollapsed()) b.classList.add('has-ctx');
    return;
  }
  document.body.classList.add('ctx-open');
  b.classList.remove('has-ctx');
  syncCtxToggle();
}
function toggleCtx() {
  if (ctxWide()) setCtxCollapsed(!ctxCollapsed());
  else document.body.classList.toggle('ctx-open');
  const open = ctxWide() ? !ctxCollapsed() : document.body.classList.contains('ctx-open');
  if (open) document.getElementById('ctx-toggle').classList.remove('has-ctx');
  syncCtxToggle();
}
// Escape and the scrim only close the drawer; they must not wipe the layout.
function closeCtx() {
  document.body.classList.remove('ctx-open');
  syncCtxToggle();
}
// The × in the rail head closes the column itself, drawer or not.
function hideCtx() {
  document.body.classList.remove('ctx-open');
  document.getElementById('ctx-toggle').classList.remove('has-ctx');
  if (ctxWide()) setCtxCollapsed(true);
  syncCtxToggle();
}
window.addEventListener('resize', syncCtxToggle);

function selectTr(tr) {
  document.querySelectorAll('tbody tr.selected').forEach(x => x.classList.remove('selected'));
  if (tr) tr.classList.add('selected');
}

// pctCompact is pct without the fixed width, for the narrow rail.
function pctCompact(v) {
  const n = Math.max(0, Math.min(1, Number(v) || 0));
  return `<span class="conf"><i><b style="width:${n * 100}%"></b></i><span>${(n * 100).toFixed(0)}%</span></span>`;
}

function factMini(f) {
  const triple = (f.entity || f.property || f.value)
    ? `<div class="muted" style="font-size:12.5px;margin-top:5px">${esc(f.entity || '')} · ${esc(f.property || '')} → ${esc(f.value || '')}</div>` : '';
  return `<button class="ctx-fact" onclick="pickFact(${f.id}, null)">
    <div class="body">${esc(f.content)}</div>${triple}
    <div class="meta"><span class="mono">#${f.id}</span><span class="spacer"></span>${f.confidence != null ? pctCompact(f.confidence) : ''}</div>
  </button>`;
}
function episodeMini(e) {
  return `<button class="ctx-fact" onclick="pickEpisode(${e.id}, null)">
    <div class="body clamp">${esc(e.content)}</div>
    <div class="meta"><span class="mono">#${e.id}</span><span class="spacer"></span><span class="muted" style="font-size:12px">${ts(e.occurred_at)}</span></div>
  </button>`;
}

async function pickEpisode(id, tr) {
  selectTr(tr);
  ctx.kind = 'episode';
  ctx.id = id;
  revealCtx();
  const req = ++ctx.req;
  ctxTitle('Episode #' + id);
  ctxShow(CTX_SKELETON);
  try {
    const d = await api('/episodes/' + id);
    if (req !== ctx.req) return;
    renderEpisodeCtx(d);
  } catch (e) {
    if (req === ctx.req) ctxShow(`<div class="ctx-note err">${esc(e.message)}</div>`);
  }
}

function renderEpisodeCtx(d) {
  const e = d.episode || {};
  const facts = d.facts || [];
  ctxTitle('Episode #' + e.id);
  const tags = (e.tags || []).length
    ? `<div class="ctx-tags">${e.tags.map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>`
    : '<span class="muted">—</span>';
  const backlog = facts.length ? '' : `<div class="ctx-note">Nothing has been extracted from this episode yet. It may still be waiting for a consolidation run, or the run found nothing worth keeping.</div>`;
  ctxShow(`
    <div class="ctx-section">
      <div class="ctx-quote lead">${esc(e.content)}</div>
      <div class="ctx-note">An episode is immutable: consolidation reads it and writes facts, but never edits the memory itself.</div>
    </div>
    <div class="ctx-section">
      <div class="ctx-section-head"><h3>Metadata</h3><span class="count">#${e.id}</span></div>
      <dl class="metagrid">
        <dt>Tags</dt><dd>${tags}</dd>
        <dt>Namespace</dt><dd class="mono">${esc(nsSlug(e.namespace_id))}</dd>
        <dt>Happened</dt><dd>${ts(e.occurred_at)}</dd>
        <dt>Stored</dt><dd>${ts(e.created_at)}</dd>
      </dl>
    </div>
    <div class="ctx-section">
      <div class="ctx-section-head"><h3>Facts from this episode</h3><span class="count">${facts.length}</span></div>
      ${facts.map(factMini).join('')}${backlog}
    </div>`);
}

async function pickFact(id, tr) {
  selectTr(tr);
  ctx.kind = 'fact';
  ctx.id = id;
  revealCtx();
  const req = ++ctx.req;
  ctxTitle('Fact #' + id);
  ctxShow(CTX_SKELETON);
  try {
    const [f, src] = await Promise.all([api('/facts/' + id), api('/facts/' + id + '/sources')]);
    if (req !== ctx.req) return;
    renderFactCtx(f, (src && src.episodes) || []);
  } catch (e) {
    if (req === ctx.req) ctxShow(`<div class="ctx-note err">${esc(e.message)}</div>`);
  }
}

function renderFactCtx(f, episodes) {
  ctxTitle('Fact #' + f.id);
  const now = Date.now();
  const st = f.valid_until && new Date(f.valid_until) < now ? 'abandoned'
    : f.valid_from && new Date(f.valid_from) > now ? 'pending' : 'active';
  const stLabel = { abandoned: 'expired', pending: 'not yet valid', active: 'active' }[st];
  const range = (f.valid_from || f.valid_until)
    ? `${f.valid_from ? ts(f.valid_from) : '…'} → ${f.valid_until ? ts(f.valid_until) : 'open'}` : 'No validity window';
  const triple = (f.entity || f.property || f.value)
    ? `<dt>Claim</dt><dd>${esc(f.entity || '')} · ${esc(f.property || '')} → ${esc(f.value || '')}</dd>` : '';
  const tags = (f.tags || []).length
    ? `<div class="ctx-tags">${f.tags.map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>`
    : '<span class="muted">—</span>';
  const sources = episodes.length
    ? episodes.map(episodeMini).join('')
    : `<div class="ctx-note">No source episodes recorded. The fact survived a purge or was merged without keeping its provenance.</div>`;
  ctxShow(`
    <div class="ctx-section">
      <div class="ctx-quote lead">${esc(f.content)}</div>
    </div>
    <div class="ctx-section">
      <div class="ctx-section-head"><h3>Metadata</h3><span class="count">#${f.id}</span></div>
      <dl class="metagrid">
        <dt>Tags</dt><dd>${tags}</dd>
        <dt>Namespace</dt><dd class="mono">${esc(nsSlug(f.namespace_id))}</dd>
        <dt>Validity</dt><dd><span class="badge ${st}">${stLabel}</span><span class="muted">${esc(range)}</span></dd>
        <dt>Confidence</dt><dd>${pctCompact(f.confidence)}</dd>
        ${triple}
        <dt>Created</dt><dd>${ts(f.created_at)}</dd>
      </dl>
    </div>

}

  const [episodes, facts, activeGoals, mental, proposed, testing, cons, fails, recent, backlog] = await Promise.all([

    countOf('contradictions'), countOf('failures'),

  const num = v => (v === null || v === undefined) ? '—' : v;

  const pending = backlog.pending_episodes || 0;

// armCell shows where one search arm placed a result: its rank and raw score, or
// a dash when the arm did not return it.
function armCell(rank, score, digits) {
  if (!rank) return '<span class="muted">–</span>';
  return `#${rank} <span class="muted">${Number(score).toFixed(digits)}</span>`;
}
async function doRecall() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const types = ['fact', 'episode'].filter(t => document.getElementById('rt-' + t).checked);
  if (!types.length) { toast('Pick facts, episodes or both', true); return; }
  const body = { query: q, namespaces: [state.ns], limit: Number(document.getElementById('rlimit').value), trace: true };
  if (types.length === 1) body.types = types;
  if (state.tags.length) body.tags = state.tags;
  const asOf = document.getElementById('rasof').value;
  if (asOf) body.as_of = new Date(asOf).toISOString();
  const graph = document.getElementById('rt-graph').value;
  if (graph) body.graph = graph === 'on';
  try {
    const res = await api('/recall', { method: 'POST', body: JSON.stringify(body) });
    const results = (res && res.results) || [];
    const graph = !!(res && res.trace && res.trace.graph);
    document.getElementById('recall-out').innerHTML = recallTraceCard(res && res.trace) + table(
      ['#', 'Type', 'Tags', 'Content', 'Score', 'Vector (cosine)', 'Keyword (ts_rank)'].concat(graph ? ['Graph'] : [], ['Fused', 'Boost', 'When']),
      results.map((r, i) => {
        const t = r.trace || {};
        const boost = (t.recency_factor != null && (t.recency_factor !== 1 || t.importance_factor !== 1))
          ? `recency ×${t.recency_factor.toFixed(2)}<br>importance ×${t.importance_factor.toFixed(2)}` : '<span class="muted">–</span>';
        return `<tr><td class="muted">${i + 1}</td>
          <td><span class="badge pending">${esc(r.type)}</span></td><td class="tagcell">${tagChips(r.tags)}</td><td class="wrap" style="min-width:280px">${esc(r.content)}</td>
          <td>${pct(r.score)}</td><td>${armCell(t.vector_rank, t.vector_similarity, 3)}</td>
          <td>${armCell(t.keyword_rank, t.keyword_score, 3)}</td>${graph ? `<td>${armCell(t.graph_rank, t.graph_score, 2)}</td>` : ''}<td class="mono">${(t.fused_score || 0).toFixed(3)}</td>
          <td class="muted">${boost}</td><td class="muted">${ts(r.occurred_at || r.created_at)}</td></tr>`;
      }));
  } catch (e) { toast(e.message, true); }
}
// recallTraceCard explains the run itself: how the query was read and what each
// step returned, so an unexpected ranking can be traced to the step that caused it.
function recallTraceCard(tr) {
  if (!tr) return '';
  // One chip per step: rows it produced and the time since the previous step.
  const steps = (tr.stages || []).map(s => `<span class="badge pending" title="rows returned, time since the previous step">${esc(s.name)}${s.count ? ' · ' + s.count : ''} · ${s.ms.toFixed(1)} ms</span>`).join(' ');
  const weights = [];
  if (tr.recency_weight > 0) weights.push(`recency ${tr.recency_weight} (half-life ${esc(tr.recency_half_life)})`);
  if (tr.importance_weight > 0) weights.push(`importance ${tr.importance_weight}`);
  return `<div class="card"><h3>How this recall ran</h3>
    <div class="muted" style="margin-bottom:10px">
      ${tr.hybrid ? 'Hybrid: vector + keyword' + (tr.graph ? ' + graph' : '') + ', reciprocal rank fusion (k=' + tr.rrf_k + ')' : 'Vector only (no usable keyword terms or hybrid recall is off)'} ·
      ${tr.candidates} candidates per arm · min similarity ${tr.min_similarity} · ${tr.namespace_ids} namespace${tr.namespace_ids === 1 ? '' : 's'}
      ${tr.as_of ? ' · as of ' + esc(ts(tr.as_of)) : ''}${weights.length ? ' · ' + weights.join(', ') : ' · no recency or importance weighting'}
      ${(tr.tags || []).length ? ' · tags ' + tr.tags.map(esc).join(' + ') : ''}
      · total ${tr.total_ms.toFixed(1)} ms
    </div>
    ${tr.keyword_query ? `<div style="margin-bottom:10px">Keyword query: <span class="mono">${esc(tr.keyword_query)}</span></div>` : ''}
    ${tr.graph ? `<div style="margin-bottom:10px">Entities named in the query: ${(tr.graph_entities || []).length ? (tr.graph_entities || []).map(e => `<span class="badge pending">${esc(e)}</span>`).join(' ') : '<span class="muted">none: the graph arm had nothing to start from</span>'}</div>` : ''}
    <div style="display:flex;flex-wrap:wrap;gap:6px">${steps}</div></div>`;
}

async function renderGoals() {
  // Subgoal and failure counts come from the page on screen (plus the failure
  // set fetched in enrich), so they describe what is visible.
  const fails = new Map();
  const pageMap = (L, key, build) => L[key] || (L[key] = build());
  const parentOf = (L, id) => pageMap(L, 'byId', () => new Map(L.items.map(g => [g.id, g]))).get(id);
  const subsOf = (L, id) => {
    const subs = pageMap(L, 'subs', () => {
      const m = new Map();
      for (const g of L.items) if (g.parent_id) m.set(g.parent_id, (m.get(g.parent_id) || 0) + 1);
      return m;
    });
    return subs.get(id) || 0;
  };
  const goal = (g, L) => `<span class="mono">#${g.id}</span> ${esc(g.content)}` +
    (g.parent_id ? `<div class="muted">part of ${parentOf(L, g.parent_id) ? `<span class="mono">#${g.parent_id}</span> ${esc(parentOf(L, g.parent_id).content)}` : `#${g.parent_id}`}</div>` : '') +
    (g.notes ? `<div class="muted">${esc(g.notes)}</div>` : '');
  const status = g => badge(g.status) +
    (g.completed_at ? `<div class="muted">${ts(g.completed_at)}</div>` : g.abandoned_at ? `<div class="muted">${ts(g.abandoned_at)}</div>` : '');
  const related = (g, L) => {
    const s = subsOf(L, g.id), f = fails.get(g.id) || 0;
    return s || f ? `<span class="muted">${s} subgoal${s === 1 ? '' : 's'} · ${f} failure${f === 1 ? '' : 's'}</span>` : '<span class="muted">—</span>';
  };
  await listTab('goals', {
    path: o => '/goals' + qs(o),
    headers: ['Goal', 'Status', 'Priority', 'Related', 'Namespace', 'Created', ''],
    fields: ['id', 'content', 'notes', 'status', 'priority'],
    actions: `<button class="primary" onclick="goalDialog()">+ New goal</button>`,
    enrich: async () => {
      const failures = await apiList('/failures' + nsQS('&limit=1000'));
      for (const f of failures) if (f.goal_id) fails.set(f.goal_id, (fails.get(f.goal_id) || 0) + 1);
    },
    row: (g, L) => `<tr>
        <td class="wrap">${goal(g, L)}</td>
        <td>${status(g)}</td>
        <td>${pct(Number(g.priority) / 10)}<div class="muted">${esc(g.priority)} / 10</div></td>
        <td>${related(g, L)}</td>
        <td class="mono">${esc(nsSlug(g.namespace_id))}</td>
        <td class="muted">${ts(g.created_at)}</td>
        <td class="row-actions">
          <button onclick="goalComplete(${g.id})">complete</button>
          <button onclick="goalAbandon(${g.id})">abandon</button>
          <button class="danger" onclick="del('goals', ${g.id})">delete</button>
        </td>
      </tr>`,
  });
}

function mmTags(tags) {

function mmStale(m) {
  // A regeneration in flight has no row state of its own on the server: the
  // model keeps its old last_refreshed_* until the new answer lands, so without
  // this the row would show "stale" for the whole run and look stuck.
  if (state.mmBusy.has(m.id)) return '<span class="badge pending">refreshing</span>';
  if (!m.content) {
    return m.last_refresh_failed_at
      ? '<span class="badge abandoned">failed</span>'
      : '<span class="badge pending">generating</span>';
  }
  if (!m.is_stale) return '<span class="badge active">fresh</span>';
  const why = m.stale_reason ? ` title="${esc(m.stale_reason)}"` : '';
  return `<span class="badge abandoned"${why}>stale</span>`;
}
/* Markdown for mental model content, bundled under /ui/vendor. Loaded on the
   tab instead of the shell: it is only needed here. */
const MD_LIBS = ['marked.umd.js', 'purify.min.js'];
let mdLibsPromise = null;
function loadMarkdownLibs() {
  if (window.marked && window.DOMPurify) return Promise.resolve();
  if (mdLibsPromise) return mdLibsPromise;
  mdLibsPromise = MD_LIBS.reduce((p, file) => p.then(() => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/ui/vendor/' + file;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load ' + file));
    document.head.appendChild(s);
  })), Promise.resolve());
  mdLibsPromise.catch(() => { mdLibsPromise = null; });
  return mdLibsPromise;
}
// md renders model content as sanitized markdown. The content is LLM output, so
// it is never trusted: DOMPurify strips scripts, event handlers and javascript:
// URLs before it reaches innerHTML.
function md(text) {
  if (!text) return '';
  if (!window.marked || !window.DOMPurify) return `<pre class="md">${esc(text)}</pre>`;
  return DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
}
// mdPlain is the one-line preview for the table cell: markdown characters would
// make the row unreadable, and rendering a truncated document would cut tags.
function mdPlain(s) {
  return String(s || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*>\s?/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '• ')
    .replace(/^\s*\d+\.\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/_([^_]+)_/g, '$1')
    .replace(/~~([^~]+)~~/g, '$1')
    .replace(/\|/g, ' ')
    .replace(/^[-: ]{3,}$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function mmContent(m) {
  const c = m.content || '';
  if (!c) {
    if (m.last_refresh_failed_at) {
      return `<div class="err">generation failed</div><div class="muted wrap">${esc(m.last_refresh_error || '')}</div>`;
    }
    return '<span class="muted">generating…</span>';
  }
  const plain = mdPlain(c);
  const short = plain.length > 240 ? plain.slice(0, 240) + '…' : plain;
  return `<div class="wrap">${esc(short)}</div>` +
    (plain.length > 240 ? `<details style="margin-top:4px"><summary class="muted" style="cursor:pointer">show more</summary><div class="md" style="margin-top:4px">${md(c)}</div></details>` : '');
}
