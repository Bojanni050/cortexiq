  try {
    mm = await api('/mental-models', { method: 'POST', body: JSON.stringify({
      name, source_query: query, namespaces, tags, max_tokens: maxTokens, async: true }) });
  } catch (e) {
    stop(e.message);
    return;
  }
  // Generation runs on the server in the background: close the dialog now so
  // the list is usable, and let mmWait() replace "generating…" when it lands.
  dlgClose(); refresh(); toast('Generating in the background…');
  if (mm && mm.id) mmWait(mm.id);
}

// mmBaseline records the refresh state a model had before we asked for a new
// one, so completion can be judged against that instead of against the row.
function mmBaseline(m) {
  return { refreshed: (m && m.last_refreshed_at) || '', failed: (m && m.last_refresh_failed_at) || '' };
}

// mmWait polls one queued model until the server records a refresh newer than
// the one we started from. The old test — content present and
// last_refreshed_source_query equal to source_query — was true for a model that
// went stale because new memories arrived, so the first poll (3s) declared it
// done while the regeneration was still running, and the row kept its stale
// badge until a manual reload. It keeps running when the reader moves to
// another tab, but only re-renders the mental-model tab so it never yanks them
// back.
async function mmWait(id, base) {
  base = base || { refreshed: '', failed: '' };
  for (let i = 0; i < 80; i++) {
    await new Promise(r => setTimeout(r, 3000));
    let m;
    try { m = await api(`/mental-models/${id}`); } catch (e) { state.mmBusy.delete(id); return; }
    const refreshed = m.last_refreshed_at || '';
    const failed = m.last_refresh_failed_at || '';
    if (refreshed !== base.refreshed && m.content) {
      state.mmBusy.delete(id);
      if (state.tab === 'mental') { toast('Mental model ready'); refresh({ quiet: true }); }
      return;
    }
    // A failed regeneration records its own timestamp and keeps the old content.
    // RFC3339 strings of one format compare correctly as text.
    if (failed && failed !== base.failed && failed > refreshed) {
      state.mmBusy.delete(id);
      if (state.tab === 'mental') {
        toast('Generation failed: ' + (m.last_refresh_error || 'unknown error'), true);
        refresh({ quiet: true });
      }
      return;
    }
    if (state.tab === 'mental') refresh({ quiet: true });
  }
  state.mmBusy.delete(id);
  if (state.tab === 'mental') refresh({ quiet: true });
}
async function mmRefresh(id) {
  let base;
  try {
    base = mmBaseline(await api(`/mental-models/${id}`));
  } catch (e) {
    toast(e.message, true);
    return;
  }
  toast('Refreshing in the background…');
  state.mmBusy.add(id);
  try {
    await api(`/mental-models/${id}/refresh`, { method: 'POST', body: JSON.stringify({ async: true }) });
  } catch (e) {
    state.mmBusy.delete(id);
    toast(e.message, true);
    return;
  }
  refresh({ quiet: true }); mmWait(id, base);
}

async function mmSave(id, rebuild) {
  const status = document.getElementById('mm-status');
  const btn = document.getElementById('mm-save-refresh');
  const name = document.getElementById('mm-name').value.trim();
  const query = document.getElementById('mm-query').value.trim();
  const tags = document.getElementById('mm-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const maxTokens = parseInt(document.getElementById('mm-tokens').value || '2048', 10);
  if (!name || !query) {
    status.className = 'err'; status.textContent = 'Name and source query are required';
    return;
  }
  status.className = 'muted'; status.textContent = 'Saving…';
  btn.disabled = true;
  try {
    await api(`/mental-models/${id}`, { method: 'PATCH', body: JSON.stringify({
      name, source_query: query, tags, max_tokens: maxTokens }) });
  } catch (e) {
    status.className = 'err'; status.textContent = e.message; btn.disabled = false;
    return;
  }
  let base = { refreshed: '', failed: '' };
  if (rebuild) {
    try { base = mmBaseline(await api(`/mental-models/${id}`)); } catch (e) { /* keep the empty baseline */ }
    try {
      await api(`/mental-models/${id}/refresh`, { method: 'POST', body: JSON.stringify({ async: true }) });
    } catch (e) {
      status.className = 'err'; status.textContent = e.message; btn.disabled = false;
      return;
    }
    state.mmBusy.add(id);
  }
  dlgClose(); refresh();
  toast(rebuild ? 'Rebuilding in the background…' : 'Mental model saved');
  if (rebuild) mmWait(id, base);
}

    ? h.source_fact_ids.map(factLine).join('') : '<span class="muted">—</span>';
  const outcome = h => {

    if (h.rejection_reason) return `<div class="muted">${ts(h.rejected_at)}</div><div>${esc(h.rejection_reason)}</div>`;
    if (h.tested_at) return `<div class="muted">tested ${ts(h.tested_at)}</div>`;

  };
  await listTab('hypotheses', {
    path: o => '/hypotheses' + qs(o),

      for (const f of facts) byId.set(f.id, f.content);

    row: h => `<tr>
      <td class="wrap"><span class="mono">#${h.id}</span> ${esc(h.content)}</td>

      <td class="wrap muted">${esc(h.verification_plan)}</td>

      <td class="row-actions">

// factCache holds the text of facts named by causal links. A link can point at a
// fact far older than the newest page of /facts, so its text is fetched by id
// once and kept: null means the server does not have that fact any more.
const factCache = new Map();

async function renderLinks() {
  // Show the fact text; a link can outlive its fact, so say that instead of
  // leaving the row looking like a failed lookup.
  const fact = id => factCache.get(id) != null
    ? `<span class="mono">#${id}</span> ${esc(factCache.get(id))}`
    : `<span class="mono">#${id}</span> <span class="muted">(fact no longer stored)</span>`;
  await listTab('links', {
    path: o => '/causal-links' + qs(o),
    headers: ['Cause', '', 'Effect', 'Confidence', 'Method', 'Created'],
    fields: ['id', 'cause_fact_id', 'effect_fact_id', 'method'],
    enrich: async items => {
      const missing = new Set();
      for (const l of items) {
        if (!factCache.has(l.cause_fact_id)) missing.add(l.cause_fact_id);
        if (!factCache.has(l.effect_fact_id)) missing.add(l.effect_fact_id);
      }
      if (!missing.size) return;
      const ids = [...missing];
      const facts = await apiList('/facts?ids=' + ids.join(','));
      for (const f of facts) factCache.set(f.id, f.content);
      // Remember what the server does not have, so a repaint does not ask again.
      for (const id of ids) if (!factCache.has(id)) factCache.set(id, null);
    },
    row: l => `<tr>
      <td class="wrap">${fact(l.cause_fact_id)}</td>
      <td class="muted">→</td>
      <td class="wrap">${fact(l.effect_fact_id)}</td>
      <td>${pct(l.confidence)}</td>
      <td class="muted">${esc(l.method)}</td>
      <td class="muted">${ts(l.created_at)}</td>
    </tr>`,
  });
}

async function renderNamespaces() {
  const kinds = ['episodes', 'facts', 'goals', 'hypotheses', 'failures'];
  // Counts are global (everything under "/"), not paged: they are footnotes to
  // the namespace list, not rows of it. The '+' marks a list that hit the API's
  // 1000-row cap.
  let counts = new Map(), capped = [];
  const depth = n => n.slug.split('/').filter(Boolean).length - 1;
  const cell = (id, i) => {
    const v = (counts.get(id) || {})[kinds[i]] || 0;
    return v ? `${v}${capped[i] ? '+' : ''}` : '<span class="muted">—</span>';
  };
  await listTab('namespaces', {
    path: o => `/namespaces?limit=${PAGE}&offset=${o}`,
    headers: ['Namespace', 'Description', 'Episodes', 'Facts', 'Goals', 'Hypotheses', 'Failures', 'Created', ''],
    fields: ['slug', 'name', 'description'],
    actions: '<button class="primary" onclick="nsDialog()">+ New namespace</button>',
    enrich: async () => {
      const lists = await Promise.all([apiList('/namespaces?limit=1000'),
        ...kinds.map(k => apiList(`/${k}?namespaces=${encodeURIComponent('/')}&limit=1000`))]);
      counts = new Map(lists[0].map(n => [n.id, {}]));
      lists.slice(1).forEach((list, i) => list.forEach(x => {
        const c = counts.get(x.namespace_id); if (c) c[kinds[i]] = (c[kinds[i]] || 0) + 1;
      }));
      capped = lists.slice(1).map(l => l.length >= 1000);
    },
    row: n => `<tr>
        <td style="padding-left:${16 + depth(n) * 18}px"><b>${esc(n.name || n.slug)}</b><div class="mono">${esc(n.slug)}</div></td>
        <td class="wrap muted">${esc(n.description)}</td>
        ${kinds.map((_, i) => `<td>${cell(n.id, i)}</td>`).join('')}
        <td class="muted">${ts(n.created_at)}</td>
        <td class="row-actions"><button onclick="nsConfigDialog('${encodeURIComponent(n.slug)}')">config</button></td>
      </tr>`,
  });
}
async function renderMetrics() {
  const body = await api('/metrics');
  const items = (body && body.metrics) || [];
  const byName = new Map();
  for (const m of items) byName.set(m.name, (byName.get(m.name) || 0) + 1);
  const reasoner = items.filter(m => m.name.startsWith('reasoner_'));
  const sum = name => reasoner.filter(m => m.name === name).reduce((n, m) => n + Number(m.value || 0), 0);
  const prompt = sum('reasoner_prompt_tokens_total');
  const completion = sum('reasoner_completion_tokens_total');
  const cost = sum('reasoner_cost_total');
  const unpriced = sum('reasoner_unpriced_calls_total');
  // Estimated cost per stage, from the reasoner_cost_total series.
  const byStage = new Map();
  for (const m of reasoner) {
    if (m.name !== 'reasoner_cost_total') continue;
    const stage = (m.labels && m.labels.stage) || 'unknown';
    byStage.set(stage, (byStage.get(stage) || 0) + Number(m.value || 0));
  }
  const money = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const costRows = [...byStage.entries()].sort((a, b) => b[1] - a[1])
    .map(([stage, v]) => `<tr><td class="mono">${esc(stage)}</td><td class="mono">${money(v)}</td></tr>`);
  const hint = unpriced > 0
    ? `<div class="muted">${unpriced.toLocaleString()} call(s) used a model without a configured price — set CORTEXIQ_MODEL_PRICES to price them.</div>` : '';
  document.getElementById('content').innerHTML =
    `<div class="stats">
      ${stat('metrics', 'var(--green)', money(cost), 'Estimated reasoner cost')}
      ${stat('metrics', 'var(--red)', unpriced.toLocaleString(), 'Unpriced reasoner calls')}
      ${stat('metrics', 'var(--accent)', items.length, 'Metric samples')}
      ${stat('metrics', 'var(--blue)', byName.size, 'Metric families')}
      ${stat('metrics', 'var(--yellow)', prompt.toLocaleString(), 'Reasoner prompt tokens')}
      ${stat('metrics', 'var(--red)', completion.toLocaleString(), 'Reasoner completion tokens')}
    </div>` +
    (costRows.length ? `<div class="card"><h3>Estimated cost by stage ${hint ? '' : ''}</h3>${hint}<div class="tablewrap"><table><thead><tr><th>Stage</th><th>Cost (configured unit)</th></tr></thead><tbody>${costRows.join('')}</tbody></table></div></div>` : '') +
    `<div class="card"><h3>All metrics <span class="muted">${esc(ts(body.updated_at))}</span></h3>` +
    table(['Metric', 'Type', 'Labels', 'Value'], items.map(m => `<tr>
      <td><b>${esc(m.name)}</b>${m.help ? `<div class="muted">${esc(m.help)}</div>` : ''}</td>
      <td class="muted">${esc(m.type)}</td>
      <td class="mono">${esc(Object.entries(m.labels || {}).map(([k, v]) => `${k}=${v}`).join(', '))}</td>
      <td class="mono">${Number(m.value).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
    </tr>`)) + '</div>';
}

    slug, name: document.getElementById('n-name').value,
    description: document.getElementById('n-desc').value }) });

}

// Known namespace config keys with their expected type and a short label, in

// column is what this namespace sets itself (ancestors may add more).
const NS_CONFIG_KEYS = [
  ['consolidation.similarity_threshold', 'number', 'Consolidation similarity threshold'],
  ['consolidation.dedup_threshold', 'number', 'Consolidation dedup threshold'],
  ['consolidation.batch_size', 'integer', 'Consolidation batch size'],

// nsConfigDialog opens the configuration editor for one namespace: the
// effective values (defaults merged with ancestor and own overrides) with the
// own overrides editable. Saving replaces the namespace's own overrides.
async function nsConfigDialog(encSlug) {
  const slug = decodeURIComponent(encSlug);
  const cfg = await api(`/namespaces/${encSlug}/config`);
  const d = document.getElementById('dlg');
  const fmt = v => v === true ? 'true' : v === false ? 'false' : String(v);
  const row = ([key, type, label]) => {
    const own = Object.prototype.hasOwnProperty.call(cfg.overrides, key);
    const eff = fmt(cfg.effective[key]);
    return `<tr>
      <td><b>${esc(label)}</b><div class="mono">${esc(key)}</div></td>
      <td class="mono">${esc(eff)}</td>
      <td><input class="cfg-input" data-key="${esc(key)}" data-type="${type}" value="${own ? esc(fmt(cfg.overrides[key])) : ''}" placeholder="${own ? '' : 'inherit'}"></td>
      <td class="row-actions">${own ? `<button onclick="nsConfigUnset('${encodeURIComponent(slug)}', '${esc(key)}')">reset</button>` : ''}</td>
    </tr>`;
  };
  d.innerHTML = `<h3>Configuration</h3>
    <div class="mono" style="margin-bottom:8px">${esc(slug)}</div>
    <p class="muted" style="margin:0 0 8px">Effective values come from the global default, overridden by this namespace and its ancestors (nearest wins). The middle column is what applies here; the input is this namespace's own override — empty means inherit.</p>
    <div class="tablewrap"><table><thead><tr><th>Key</th><th>Effective</th><th>Override</th><th></th></tr></thead>
    <tbody>${NS_CONFIG_KEYS.map(row).join('')}</tbody></table></div>
    <div class="actions"><button onclick="dlgClose()">Close</button><button class="primary" onclick="nsConfigSave('${encodeURIComponent(slug)}')">Save overrides</button></div>`;
  d.style.maxWidth = '720px';
  d.showModal();
}

// nsConfigSave collects the override inputs, parses them by their declared type,
// and PUTs them as the namespace's own overrides. Empty inputs are dropped, so
// clearing a field resets that key to inherit.
async function nsConfigSave(encSlug) {
  const slug = decodeURIComponent(encSlug);
  const overrides = {};
  document.querySelectorAll('#dlg .cfg-input').forEach(inp => {
    const raw = inp.value.trim();
    if (!raw) return;
    const key = inp.dataset.key, type = inp.dataset.type;
    if (type === 'boolean') {
      if (raw !== 'true' && raw !== 'false') { toast(`"${key}" must be true or false`, true); throw new Error('invalid'); }
      overrides[key] = raw === 'true';
    } else if (type === 'integer') {
      const n = Number(raw);
      if (!Number.isInteger(n)) { toast(`"${key}" must be an integer`, true); throw new Error('invalid'); }
      overrides[key] = n;
    } else {
      const n = Number(raw);
      if (Number.isNaN(n)) { toast(`"${key}" must be a number`, true); throw new Error('invalid'); }
      overrides[key] = n;
    }
  });
  await api(`/namespaces/${encSlug}/config`, {
    method: 'PUT', body: JSON.stringify({ overrides }) });
  dlgClose(); refresh(); toast('Configuration saved');
}

// nsConfigUnset removes one override key so the namespace inherits it again.
async function nsConfigUnset(encSlug, key) {
  await api(`/namespaces/${encSlug}/config?key=${encodeURIComponent(key)}`, { method: 'DELETE' });
  dlgClose(); await nsConfigDialog(encSlug); toast('Override reset');
}

async function purge(kind, id) {
  if (!confirm(`Purge ${kind.slice(0, -1)} #${id}? This cannot be undone.`)) return;
  await api(`/${kind}/${id}`, { method: 'DELETE' }); refresh(); toast('Purged');
}
// retractDialog asks what was wrong before anything is touched: the reason is
// the part that makes a retraction worth more than a delete.
function retractDialog(kind, id) {
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>Retract ${kind.slice(0, -1)} #${id}</h3>
    <p class="muted" style="margin:0 0 12px">The memory stops being recalled, but the claim and what you
      write here stay in the record, so a later reader finds the correction instead of a hole.
      If it was not wrong and you just want it gone, purge it instead.</p>
    <label>What was wrong, and what is true instead?</label><textarea id="rt-reason"></textarea>
    <div class="actions"><button onclick="dlgClose()">Cancel</button><button class="primary" onclick="retract('${kind}', ${id})">Retract</button></div>`;
  d.showModal();
  document.getElementById('rt-reason').focus();
}
async function retract(kind, id) {
  const reason = document.getElementById('rt-reason').value.trim();
  if (!reason) { toast('A retraction needs a reason', true); return; }
  try {
    await api(`/${kind}/${id}/retract`, { method: 'POST', body: JSON.stringify({ reason }) });
    dlgClose(); refresh(); toast('Retracted');
  } catch (e) { toast(e.message, true); }
}
async function del(kind, id) {
  if (!confirm(`Delete ${kind.slice(0, -1)} #${id}?`)) return;
  await api(`/${kind}/${id}`, { method: 'DELETE' }); refresh(); toast('Deleted');
}
function dlgClose() {
  const d = document.getElementById('dlg');
  d.close();
  // The toast may have been parked inside the dialog to stay above its
  // backdrop; put it back so later messages are visible again.
  document.body.appendChild(document.getElementById('toast'));
}

// Lifecycle is the audit trail of the two verbs that leave a record. They are
// merged into one timeline because the question a reader has is "what happened
// to this memory", not "which table is it in".
async function renderLifecycle() {
  const [retractions, purges] = await Promise.all([
    apiList('/retractions' + nsQS('&limit=200')),
    apiList('/purge-log?limit=200'),
  ]);
  const events = retractions.map(r => ({
    kind: 'retracted', at: r.created_at, target_type: r.target_type, target_id: r.target_id,
    ns: r.namespace_id, content: r.content, reason: r.reason, by: r.retracted_by, details: null,
  })).concat(purges.map(p => ({
    kind: 'purged', at: p.purged_at, target_table: p.target_table, target_id: p.target_id,
    ns: p.namespace_id, content: '', reason: p.reason, by: p.requested_by, details: p.details,
  }))).sort((a, b) => new Date(b.at) - new Date(a.at));

  // A retraction can still quote the claim; a purge cannot, by design.
  const what = ev => {
    if (ev.kind === 'retracted') return `<span class="wrap">${esc(ev.content)}</span>`;
    const parts = Object.entries(ev.details || {}).filter(([, v]) => v)
      .map(([k, v]) => `${v} ${v === 1 && k.endsWith('s') ? k.slice(0, -1) : k}`);
    return parts.length ? `<span class="muted">${esc(parts.join(' · '))}</span>` : '<span class="muted">—</span>';
  };
  // Purge rows name their table in the plural ("episodes #258"); a single row
  // reads better in the singular, like the retraction rows next to it.
  const target = ev => ev.kind === 'retracted'
    ? `${ev.target_type} #${ev.target_id}`
    : `${ev.target_table.replace(/s$/, '')} #${ev.target_id}`;

  document.getElementById('content').innerHTML =
    `<div class="card"><h3>Retractions and purges</h3>
      <p class="muted" style="margin:0 0 12px">
        Newest first, up to 200 of each. <b>Retracted</b> means the memory was wrong: it is hidden and
        the claim plus the reason stay here. <b>Purged</b> means it is gone, embedding included; the log
        records that it happened and never what it said. Retractions follow the namespace selector;
        purge records are global, because a purge can take the namespace with it.
      </p>` +
      table(['When', 'What', 'Target', 'Namespace', 'Content or counts', 'Reason', 'By'],
        events.map(ev => `<tr>
          <td class="muted">${ts(ev.at)}</td>
          <td><span class="badge ${ev.kind === 'purged' ? 'abandoned' : 'pending'}">${ev.kind}</span></td>
          <td class="mono">${esc(target(ev))}</td>
          <td class="mono">${esc(ev.ns == null ? 'gone' : nsSlug(ev.ns))}</td>
          <td>${what(ev)}</td>
          <td class="wrap">${esc(ev.reason)}</td>
          <td class="mono">${esc(ev.by)}</td>
        </tr>`)) +
    '</div>';
}

/* ---------- Graph tab (Cytoscape.js, bundled under /ui/vendor) ---------- */
const GRAPH_LIBS = ['cytoscape.min.js', 'layout-base.js', 'cose-base.js', 'cytoscape-fcose.js'];
let graphLibsPromise = null;
function loadGraphLibs() {
  if (window.cytoscape && window.__fcoseReady) return Promise.resolve();
  if (graphLibsPromise) return graphLibsPromise;
  // Order matters: each file registers a global the next one needs.
  graphLibsPromise = GRAPH_LIBS.reduce((p, file) => p.then(() => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/ui/vendor/' + file;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load ' + file));
    document.head.appendChild(s);
  })), Promise.resolve()).then(() => { window.cytoscape.use(window.cytoscapeFcose); window.__fcoseReady = true; });
  graphLibsPromise.catch(() => { graphLibsPromise = null; });
  return graphLibsPromise;
}

const graphState = { q: '', canonical: '', limit: 150, minConf: 0, data: null };
const NS_COLORS = ['#3fa287', '#7fa04a', '#c9a86a', '#4f8f9e', '#9a8fb5', '#6aa17a', '#b07a5a', '#5b7f8f', '#a8b06a', '#8a7f6a'];
const REL_COLORS = ['#3fa287', '#7fa04a', '#c9a86a', '#4f8f9e', '#9a8fb5', '#6aa17a', '#b07a5a', '#5b7f8f', '#a8b06a', '#8a7f6a',
  '#e879f9', '#22d3ee', '#facc15', '#4ade80', '#c084fc', '#fda4af'];
const UNMAPPED_COLOR = '#5d677c';
let relColor = () => UNMAPPED_COLOR;

function destroyGraph() {
  if (state.cy) { try { state.cy.destroy(); } catch (e) {} state.cy = null; }
}

async function renderGraph() {
  destroyGraph();
  document.getElementById('content').innerHTML = `
    ${toolbar(`
      <input id="g-q" placeholder="Focus on an entity (e.g. CortexIQ)…" value="${esc(graphState.q)}"
        onkeydown="if(event.key==='Enter'){graphState.q=this.value.trim();loadGraph()}">
      <select id="g-type" title="Relation type" onchange="graphState.canonical=this.value;loadGraph()"></select>
      <select id="g-conf" title="Minimum confidence" onchange="graphState.minConf=Number(this.value);loadGraph()">
        ${[0, 0.8, 0.9].map(v => `<option value="${v}"${graphState.minConf === v ? ' selected' : ''}>${v ? 'Confidence ≥ ' + v : 'Any confidence'}</option>`).join('')}
      </select>
      <select id="g-limit" title="Maximum number of entities" onchange="graphState.limit=Number(this.value);loadGraph()">
        ${[50, 100, 150, 300, 500].map(v => `<option value="${v}"${graphState.limit === v ? ' selected' : ''}>${v} entities</option>`).join('')}
      </select>
      <button onclick="graphLayout(true)" title="Shake the layout">Re-layout</button>
      <button onclick="state.cy && state.cy.animate({fit:{padding:30}, duration:350})">Fit</button>`)}
    <div class="gmeta" id="g-meta"></div>
    <div class="gwrap">
      <div id="cy"></div>
      <div class="gpanel" id="g-panel" hidden></div>
      <div class="glegend" id="g-legend"></div>
    </div>`;
  await loadGraphLibs();
  await loadGraph();
}

function graphColors(data) {
  // Most used relation types get the first (most distinct) colours.
  const types = Object.entries(data.canonical_counts || {}).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(x => x[0]);
  relColor = c => { const i = types.indexOf(c); return i < 0 ? UNMAPPED_COLOR : REL_COLORS[i % REL_COLORS.length]; };
}

async function loadGraph() {
  const meta = document.getElementById('g-meta');
  if (meta) meta.textContent = 'Loading…';
  const p = new URLSearchParams({ namespaces: state.ns, limit: graphState.limit });
  if (graphState.q) p.set('q', graphState.q);
  if (graphState.minConf) p.set('min_confidence', graphState.minConf);
  if (graphState.canonical === '@mapped') p.set('mapped', '1');
  else if (graphState.canonical) p.set('canonical', graphState.canonical);
  const data = await api('/graph?' + p.toString());
  graphState.data = data;
  graphColors(data);
  drawGraphChrome(data);
  drawGraph(data);
}

function drawGraphChrome(data) {
  const sel = document.getElementById('g-type');
  if (sel) {
    const counts = Object.entries(data.canonical_counts || {}).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    sel.innerHTML = `<option value="">All relation types</option><option value="@mapped">Only normalised types</option>` +
      counts.map(([c, n]) => `<option value="${esc(c)}">${esc(c)} (${n})</option>`).join('');
    sel.value = graphState.canonical;
    if (sel.value !== graphState.canonical) { graphState.canonical = ''; sel.value = ''; }
  }
  const meta = document.getElementById('g-meta');
  if (meta) {
    const mapped = Object.values(data.canonical_counts || {}).reduce((a, b) => a + b, 0);
    meta.innerHTML = `Showing <b>${data.nodes.length}</b> of ${data.total_nodes} entities and <b>${data.edges.length}</b> of ${data.total_edges} relations` +
      (data.truncated ? ' <span class="muted">· cut to the best-connected entities, raise the limit or focus on one</span>' : '') +
      ` · ${mapped} normalised, ${data.unmapped} free-text relation${data.unmapped === 1 ? '' : 's'} <span class="muted">(dashed)</span>`;
  }
  const legend = document.getElementById('g-legend');
  if (legend) {
    const used = new Map();
    data.edges.forEach(e => used.set(e.canonical || '', (used.get(e.canonical || '') || 0) + 1));
    const items = [...used.entries()].sort((a, b) => b[1] - a[1]);
    legend.innerHTML = items.slice(0, 14).map(([c, n]) => {
      const name = c || 'free text';
      const on = graphState.canonical === c && c;
      return `<button class="chip${on ? ' on' : ''}" ${c ? `onclick="graphPickType('${esc(c)}')"` : 'disabled'} title="${n} relation${n === 1 ? '' : 's'} shown">
        <i style="background:${relColor(c)}${c ? '' : ';opacity:.6'}"></i>${esc(name)}</button>`;
    }).join('');
  }
}

function graphPickType(c) {
  graphState.canonical = graphState.canonical === c ? '' : c;
  loadGraph();
}

function graphElements(data) {
  const maxDeg = Math.max(1, ...data.nodes.map(n => n.degree));
  const nodes = data.nodes.map(n => ({ group: 'nodes', data: {
    id: n.id, label: n.label, degree: n.degree, ns: n.namespace_id, size: 16 + 40 * Math.sqrt(n.degree / maxDeg),
    color: NS_COLORS[Math.abs(n.namespace_id) % NS_COLORS.length] } }));
  const edges = data.edges.map((e, i) => ({ group: 'edges', data: {
    id: 'e' + i, source: e.source, target: e.target, label: e.label, canonical: e.canonical || '', count: e.count,
    conf: e.confidence, types: e.types, factId: e.fact_id || 0, ns: e.namespace_id, color: relColor(e.canonical || '') } }));
  return nodes.concat(edges);
}

function graphStyle() {
  const light = document.documentElement.dataset.theme === 'light';
  const ink = light ? '#161a24' : '#eef1f8';
  const halo = light ? '#f4f5fa' : '#0a0d14';
  return [
  { selector: 'node', style: {
    'label': 'data(label)', 'background-color': 'data(color)', 'width': 'data(size)', 'height': 'data(size)',
    'font-size': 11, 'color': ink, 'text-valign': 'bottom', 'text-margin-y': 5, 'text-wrap': 'ellipsis', 'text-max-width': 130,
    'text-outline-color': halo, 'text-outline-width': 2.5, 'min-zoomed-font-size': 8,
    'border-width': 2, 'border-color': 'rgba(255,255,255,.28)', 'overlay-opacity': 0,
    'transition-property': 'opacity, border-width, border-color', 'transition-duration': '0.15s' } },
  { selector: 'edge', style: {
    'width': 'mapData(count, 1, 6, 1.4, 4.5)', 'line-color': 'data(color)', 'target-arrow-color': 'data(color)',
    'target-arrow-shape': 'triangle', 'arrow-scale': 0.85, 'curve-style': 'bezier', 'opacity': 0.55,
    'font-size': 9.5, 'color': ink, 'text-background-color': halo, 'text-background-opacity': 0.9,
    'text-background-padding': 2, 'text-rotation': 'autorotate', 'overlay-opacity': 0,
    'transition-property': 'opacity, width', 'transition-duration': '0.15s' } },
  { selector: 'edge[canonical = ""]', style: { 'line-style': 'dashed', 'line-dash-pattern': [5, 4] } },
  { selector: 'node.hub', style: { 'min-zoomed-font-size': 0, 'font-size': 13, 'font-weight': 600 } },
  { selector: '.faded', style: { 'opacity': 0.07, 'text-opacity': 0 } },
  { selector: 'node.hl', style: { 'border-color': '#ffffff', 'border-width': 3 } },
  { selector: 'edge.hl', style: { 'opacity': 1, 'label': 'data(label)', 'z-index': 10 } },
  { selector: 'node:selected', style: { 'border-color': '#ffffff', 'border-width': 4 } },
  { selector: 'edge:selected', style: { 'opacity': 1, 'label': 'data(label)', 'width': 5, 'z-index': 11 } },
  ];
}

function drawGraph(data) {
  const box = document.getElementById('cy');
  if (!box) return;
  closeGraphPanel();
  if (!data.nodes.length) {
    destroyGraph();
    box.innerHTML = '<div class="empty"><div class="big">∅</div>No relations match these filters</div>';
    return;
  }
  box.innerHTML = '';
  destroyGraph();
  const cy = state.cy = cytoscape({
    container: box, elements: graphElements(data), style: graphStyle(),
    minZoom: 0.1, maxZoom: 3.5, wheelSensitivity: 0.25, boxSelectionEnabled: false,
  });
  // The best-connected entities keep their name visible even when zoomed far out.
  cy.nodes().sort((a, b) => b.data('degree') - a.data('degree')).slice(0, 14).addClass('hub');
  cy.on('mouseover', 'node', ev => {
    const nb = ev.target.closedNeighborhood();
    cy.elements().not(nb).addClass('faded');
    nb.addClass('hl');
  });
  cy.on('mouseout', 'node', () => cy.elements().removeClass('faded hl'));
  cy.on('mouseover', 'edge', ev => ev.target.addClass('hl'));
  cy.on('mouseout', 'edge', ev => ev.target.removeClass('hl'));
  cy.on('tap', 'node', ev => showNodePanel(ev.target));
  cy.on('tap', 'edge', ev => showEdgePanel(ev.target));
  cy.on('tap', ev => { if (ev.target === cy) closeGraphPanel(); });
  cy.on('dbltap', 'node', ev => { graphFocus(ev.target.data('label')); });
  graphLayout(false);
}

function graphLayout(shake) {
  const cy = state.cy;
  if (!cy) return;
  const n = cy.nodes().length, big = n > 250;
  // Small graphs get tighter spacing; big ones need room.
  const repulsion = n < 60 ? 5500 : n < 200 ? 9500 : 14000, edgeLen = n < 60 ? 75 : n < 200 ? 95 : 120;
  cy.layout({
    name: 'fcose', quality: big ? 'draft' : 'default', randomize: true, animate: !big || shake, animationDuration: 800,
    fit: true, padding: 36, nodeRepulsion: () => repulsion, idealEdgeLength: () => edgeLen, edgeElasticity: () => 0.45,
    gravity: 0.3, numIter: 2500, packComponents: true, tile: true, nodeSeparation: 80,
  }).run();
}

function graphFocus(label) {
  graphState.q = label;
  const input = document.getElementById('g-q');
  if (input) input.value = label;
  loadGraph();
}

function closeGraphPanel() {
  const p = document.getElementById('g-panel');
  if (p) { p.hidden = true; p.innerHTML = ''; }
  if (state.cy) state.cy.elements().unselect();
}

function relPill(e) {
  const d = e.data();
  return `<span class="pill" style="--c:${d.color}">${esc(d.label)}</span>`;
}

function showNodePanel(node) {
  const d = node.data();
  const out = node.outgoers('edge'), inc = node.incomers('edge');
  const row = (e, dir) => {
    const other = dir === 'out' ? e.target() : e.source();
    return `<div class="grow" onclick="graphSelectNode('${esc(other.id()).replace(/'/g, '&#39;')}')">
      <span class="muted">${dir === 'out' ? '→' : '←'}</span> ${relPill(e)} <b>${esc(other.data('label'))}</b>${e.data('count') > 1 ? ` <span class="muted">×${e.data('count')}</span>` : ''}</div>`;
  };
  const panel = document.getElementById('g-panel');
  panel.innerHTML = `
    <button class="gx" onclick="closeGraphPanel()" aria-label="Close">×</button>
    <h4>${esc(d.label)}</h4>
    <div class="muted">${d.degree} relation${d.degree === 1 ? '' : 's'} · <span class="mono">${esc(nsSlug(d.ns))}</span></div>
    <div class="gactions"><button class="btn" onclick="graphFocus(${esc(JSON.stringify(d.label))})">Focus on this entity</button></div>
    <div class="glist">${out.map(e => row(e, 'out')).join('')}${inc.map(e => row(e, 'in')).join('')}</div>`;
  panel.hidden = false;
}

function graphSelectNode(id) {
  const cy = state.cy;
  if (!cy) return;
  const n = cy.getElementById(id);
  if (!n.length) return;
  cy.elements().unselect();
  n.select();
  cy.animate({ center: { eles: n }, duration: 300 });
  showNodePanel(n);
}

async function showEdgePanel(edge) {
  const d = edge.data();
  const panel = document.getElementById('g-panel');
  panel.innerHTML = `
    <button class="gx" onclick="closeGraphPanel()" aria-label="Close">×</button>
    <h4><b>${esc(edge.source().data('label'))}</b> ${relPill(edge)} <b>${esc(edge.target().data('label'))}</b></h4>
    <div class="muted">${d.canonical ? 'Normalised type <b>' + esc(d.canonical) + '</b>' : 'Free-text relation (no normalised type)'}</div>
    <div class="gkv"><span>Stated</span><b>${d.count}×</b><span>Confidence</span>${pct(d.conf)}</div>
    <div class="gkv"><span>Original wording</span><b>${(d.types || []).map(esc).join(', ')}</b></div>
    <div class="gsrc muted">${d.factId ? 'Loading source fact…' : ''}</div>`;
  panel.hidden = false;
  if (!d.factId) return;
  try {
    const f = await api('/facts/' + d.factId);
    if (panel.hidden || !state.cy) return;
    const src = panel.querySelector('.gsrc');
    if (src) src.innerHTML = `<div class="label" style="padding:0 0 4px">Source fact <span class="mono">#${f.id}</span></div><div class="gquote">${esc(f.content)}</div>`;
  } catch (e) {
    const src = panel.querySelector('.gsrc');
    if (src) src.textContent = 'Source fact not available';
  }
}

function secs(v) {
  return v < 60 ? v + ' seconds' : (v / 60) + (v === 60 ? ' minute' : ' minutes');
}

async function renderSettings() {
  const s = await api('/settings/schedule');
  const modes = [
    ['events', 'Only after a new remember', 'A run starts as soon as an episode is stored; nothing runs on a timer.'],
    ['events_interval', 'After a new remember, and every …', 'New episodes start a run, and the interval runs as a safety net for writes from another process.'],
    ['interval', 'Only every …', 'The timer ignores new episodes until its next tick.'],
  ];
  const modeOpts = modes.map(([v, label]) => `<option value="${v}"${v === s.mode ? ' selected' : ''}>${label}</option>`).join('');
  const intOpts = (s.intervals || []).map(v => `<option value="${v}"${v === s.interval_seconds ? ' selected' : ''}>${secs(v)}</option>`).join('');
  const current = s.mode === 'events'
    ? 'only after a new remember'
    : (s.mode === 'events_interval' ? 'after a new remember, plus every ' : 'every ') + esc(secs(s.interval_seconds));

  document.getElementById('content').innerHTML = `
    <div class="card">
      <h3>Consolidation schedule</h3>
      <p class="muted">New memories arrive as episodes; a run turns them into facts, relationships and patterns. One setting covers the whole installation and takes effect without a restart.</p>
      <div class="label" style="padding:16px 0 6px">When to consolidate</div>
      <select id="sc-mode" onchange="scSync()" style="width:100%;max-width:460px">${modeOpts}</select>
      <div class="label" style="padding:16px 0 6px">Interval</div>
      <select id="sc-interval" style="width:100%;max-width:460px">${intOpts}</select>
      <p class="muted" style="margin:14px 0 0">${modes.find(m => m[0] === s.mode)[2]}</p>
      <div class="actions" style="margin-top:16px"><button class="primary" onclick="saveSchedule()">Save</button></div>
      <p class="muted" style="margin-top:14px">Current: <b>${current}</b>. Every start does one catch-up run, so memories written while the service was down are not missed.</p>
    </div>
    <div id="models-card"></div>`;
  scSync();
  renderModelsCard();
}

/* ---------- Models and providers ---------- */
const PURPOSES = [
  ['reasoner', 'Reasoner', 'Extracts facts, relationships and patterns. Takes effect immediately.'],
  ['triage', 'Triage', 'Cheap model in front of the extractor; unset means every cluster goes straight to the reasoner.'],
  ['embedding', 'Embedding', 'Turns text into the vectors recall searches. Cannot change under a running instance.'],
  ['reranker', 'Reranker', 'Cross-encoder that re-orders fused candidates. Takes effect after a restart.'],
];
const PROVIDER_PRESETS = [
  ['deepinfra', 'DeepInfra', 'https://api.deepinfra.com/v1/openai'],
  ['mistral', 'Mistral', 'https://api.mistral.ai/v1'],
];
function money(v) { return typeof v === 'number' && v > 0 ? '$' + v.toFixed(2) : 'price unknown'; }
function modelLabel(m) {
  const bits = [];
  if (m.context) bits.push((m.context / 1000).toFixed(0) + 'k ctx');
  if (m.input_per_mtok || m.output_per_mtok) bits.push(money(m.input_per_mtok) + ' in / ' + money(m.output_per_mtok) + ' out per Mtok');
  if ((m.capabilities || []).length) bits.push(m.capabilities.slice(0, 4).join(', '));
  return m.id + (bits.length ? ' — ' + bits.join(' · ') : '');
}
async function renderModelsCard() {
  const el = document.getElementById('models-card');
  if (!el) return;
  let purposes = [], providers = [];
  try {
    purposes = await api('/models');
    providers = await api('/providers');
  } catch (e) {
    el.innerHTML = `<div class="card"><h3>Models</h3><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  const rows = purposes.map(p => {
    const spec = PURPOSES.find(x => x[0] === p.purpose) || [p.purpose, p.purpose, ''];
    const source = p.source === 'dashboard'
      ? `<span class="badge pending">dashboard</span> <span class="mono">${esc(p.provider)}</span>`
      : '<span class="badge active">env</span>';
    const model = p.model ? `<span class="mono">${esc(p.model)}</span>` : '<span class="muted">not configured</span>';
    const env = p.source === 'dashboard' && p.env ? `<div class="muted">env: <span class="mono">${esc(p.env)}</span></div>` : '';
    const note = p.restart_required ? '<div class="muted">a change here needs a restart</div>' : '';
    // The embedding model is read-only here on purpose: stored vectors carry its
    // dimensions, so changing it is a re-embed job, not a dropdown.
    const btn = p.purpose === 'embedding'
      ? '<span class="muted">read-only</span>'
      : `<button onclick="modelDialog('${p.purpose}')">change</button>`;
    return `<tr><td><b>${esc(spec[1])}</b><div class="muted">${esc(spec[2])}</div></td>
      <td>${source}${env}</td><td>${model}${note}</td><td class="row-actions">${btn}</td></tr>`;
  }).join('');
  const provRows = providers.map(p => `<tr><td><b>${esc(p.name)}</b><div class="muted mono">${esc(p.slug)}</div></td>
      <td class="mono wrap">${esc(p.base_url)}</td>
      <td>${p.key_hint ? `<span class="badge active">key ${esc(p.key_hint)}</span>` : '<span class="badge abandoned">no key</span>'}</td>
      <td class="row-actions"><button onclick="providerTest('${p.slug}')">test</button><button onclick="providerForm('${p.slug}')">edit</button></td></tr>`).join('');
  const presetButtons = PROVIDER_PRESETS.map(([slug, name, url]) => {
    const exists = providers.some(p => p.slug === slug);
    return `<button onclick="providerPreset('${slug}','${name}','${url}')">${exists ? 'edit' : 'add'} ${esc(name)}</button>`;
  }).join(' ');
  el.innerHTML = `<div class="card">
      <h3>Models</h3>
      <p class="muted">What each part of consolidation calls. The environment stays the default; a choice made here overrides it and is shown next to it, never instead of it.</p>
      ${table(['Purpose', 'Source', 'Model', ''], [rows])}
    </div>
    <div class="card">
      <h3>Providers</h3>
      <p class="muted">OpenAI-compatible endpoints. The key is write-only: it is stored and never shown again, only its last four characters.</p>
      ${table(['Provider', 'Base URL', 'Key', ''], [provRows])}
      <div class="actions" style="margin-top:14px">${presetButtons}</div>
    </div>`;
}
function providerPreset(slug, name, url) { providerForm(slug, name, url); }
async function providerForm(slug, name, url) {
  let p = { slug: slug || '', name: name || '', base_url: url || '', key_hint: '' };
  if (!name) {
    try { const list = await api('/providers'); const found = list.find(x => x.slug === slug); if (found) p = found; } catch (e) {}
  }
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>Provider</h3>
    <div class="label">Slug</div><input id="pv-slug" value="${esc(p.slug)}" ${slug ? 'readonly' : ''} style="width:100%">
    <div class="label">Name</div><input id="pv-name" value="${esc(p.name)}" style="width:100%">
    <div class="label">Base URL</div><input id="pv-url" value="${esc(p.base_url)}" style="width:100%">
    <div class="label">API key ${p.key_hint ? `<span class="muted">(stored: ${esc(p.key_hint)} — leave empty to keep it)</span>` : ''}</div>
    <input id="pv-key" type="password" autocomplete="off" style="width:100%">
    <div class="actions"><button onclick="dlgClose()">Cancel</button><button class="primary" onclick="providerSave()">Save</button></div>`;
  d.showModal();
}
async function providerSave() {
  const body = {
    slug: document.getElementById('pv-slug').value.trim(),
    name: document.getElementById('pv-name').value.trim(),
    base_url: document.getElementById('pv-url').value.trim(),
    api_key: document.getElementById('pv-key').value,
  };
  try {
    await api('/providers', { method: 'POST', body: JSON.stringify(body) });
    dlgClose(); renderModelsCard(); toast('Provider saved');
  } catch (e) { toast(e.message, true); }
}
async function providerTest(slug) {
  try {
    const r = await api('/providers/' + encodeURIComponent(slug) + '/test', { method: 'POST' });
    toast(r.ok ? `${slug}: ${r.models} models · ${r.message}` : `${slug}: ${r.message}`, !r.ok);
  } catch (e) { toast(e.message, true); }
}
async function modelDialog(purpose) {
  const spec = PURPOSES.find(x => x[0] === purpose) || [purpose, purpose, ''];
  let providers = [];
  try { providers = await api('/providers'); } catch (e) { toast(e.message, true); return; }
  if (!providers.length) { toast('Add a provider first', true); return; }
  const opts = providers.map(p => `<option value="${esc(p.slug)}">${esc(p.name)}</option>`).join('');
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>${esc(spec[1])} model</h3>
    <p class="muted">${esc(spec[2])}</p>
    <div class="label">Provider</div><select id="md-provider" style="width:100%" onchange="mdLoad()">${opts}</select>
    <div class="actions" style="margin:10px 0"><button onclick="mdLoad(true)">Fetch models</button></div>
    <div class="label">Model</div><select id="md-model" style="width:100%" onchange="mdDetail()"><option value="">fetch the list first</option></select>
    <div id="md-detail" class="muted" style="margin-top:10px"></div>
    <div class="actions"><button onclick="dlgClose()">Cancel</button><button class="primary" onclick="mdSave('${purpose}')">Save</button>
      <button onclick="mdClear('${purpose}')">Use env</button></div>`;
  d.showModal();
  mdLoad();
}
async function mdLoad() {
  const slug = document.getElementById('md-provider').value;
  const sel = document.getElementById('md-model');
  try {
    const models = await api('/providers/' + encodeURIComponent(slug) + '/models');
    sel.innerHTML = models.map(m => `<option value="${esc(m.id)}" title="${esc(m.description || '')}">${esc(modelLabel(m))}</option>`).join('') || '<option value="">no models returned</option>';
    mdDetail();
  } catch (e) {
    sel.innerHTML = '<option value="">could not fetch models</option>';
    toast(e.message, true);
  }
}
function mdDetail() {
  const sel = document.getElementById('md-model');
  const el = document.getElementById('md-detail');
  const opt = sel.options[sel.selectedIndex];
  el.textContent = opt ? (opt.title || '') : '';
}
async function mdSave(purpose) {
  const provider = document.getElementById('md-provider').value;
  const model = document.getElementById('md-model').value;
  if (!model) { toast('Pick a model', true); return; }
  try {
    const r = await api('/models/' + encodeURIComponent(purpose), { method: 'PUT', body: JSON.stringify({ provider, model }) });
    dlgClose(); renderModelsCard();
    toast(r.live ? 'Saved and in use' : (r.error ? 'Saved, not live yet: ' + r.error : 'Saved'));
  } catch (e) { toast(e.message, true); }
}
async function mdClear(purpose) {
  try {
    await api('/models/' + encodeURIComponent(purpose), { method: 'DELETE' });
    dlgClose(); renderModelsCard(); toast('Back to the environment value');
  } catch (e) { toast(e.message, true); }
}



function scSync() {
  const mode = document.getElementById('sc-mode').value;
  const interval = document.getElementById('sc-interval');
  if (interval) {
    interval.disabled = mode === 'events';
    interval.style.opacity = mode === 'events' ? '.45' : '';
  }
}

async function saveSchedule() {
  const mode = document.getElementById('sc-mode').value;
  const interval_seconds = Number(document.getElementById('sc-interval').value);
  try {
    await api('/settings/schedule', { method: 'PUT', body: JSON.stringify({ mode, interval_seconds }) });
    toast('Schedule saved');
    await renderSettings();
  } catch (e) {
    toast(e.message, true);
  }
}

const renderers = { overview: renderOverview, graph: renderGraph, episodes: renderEpisodes, recall: renderRecall, facts: renderFacts,
  goals: renderGoals, mental: renderMentalModels, hypotheses: renderHypotheses, contradictions: renderContradictions,
  failures: renderFailures, links: renderLinks, namespaces: renderNamespaces, runs: renderRuns, lifecycle: renderLifecycle,
  settings: renderSettings, metrics: renderMetrics, stats: renderStats };

async function refresh(opts) {
  const quiet = !!(opts && opts.quiet);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const t = tabs.find(x => x[0] === state.tab);
  document.getElementById('crumbs').textContent = tabGroup(state.tab);
  document.getElementById('page-title').textContent = t[1];
  document.getElementById('page-sub').textContent = t[2];
  // Only a tab change resets the rail: a quiet refresh must not close the
  // memory the reader is looking at.
  if (state.ctxTab !== state.tab) { state.ctxTab = state.tab; ctxIdle(); }
  document.getElementById('ns-select').disabled = state.tab === 'namespaces' || state.tab === 'settings';
  const c = document.getElementById('content');
  if (!quiet) document.getElementById('loading').style.display = 'block';
  destroyGraph();
  try {
    // Namespaces only change through this dashboard, so load them on the first
    // paint (and after a mutation), not on every refresh or poll.
    if (!state.nsLoaded) await loadNamespaces();
    // No c.innerHTML = '': the renderer replaces the content when the tab
    // changes, and list tabs swap only their table, so a refresh no longer
    // blanks the screen.
    await renderers[state.tab]();
  } catch (e) {
    c.innerHTML = `<div class="empty error">${esc(e.message)}</div>`;
    toast(e.message, true);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}
function tabFromHash() {
  const id = location.hash.replace(/^#/, '');
  return tabs.some(([t]) => t === id) ? id : 'overview';
}
window.addEventListener('hashchange', () => {
  const id = tabFromHash();
  if (id === state.tab) return;
  state.tab = id;
  refresh();
});
document.addEventListener('keydown', e => {
  const dlg = document.getElementById('dlg');
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === '/' && !typing && !(dlg && dlg.open)) {
    const f = document.querySelector('#content input[placeholder^="Filter"]') || document.getElementById('q');
    if (f) { e.preventDefault(); f.focus(); }
  }
  if (e.key === 'Escape' && !(dlg && dlg.open)) closeCtx();
});
state.tab = tabFromHash();
syncCtxToggle();
refresh();
</script>
