<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash Dashboard</title>
<style>
:root {
  --bg: #0b0e14; --bg-2: #0f131b; --panel: #131824; --panel-2: #181e2c; --border: #232b3d; --border-2: #2d374d;
  --fg: #e7ecf5; --muted: #8a94a8; --dim: #5d677c;
  --accent: #7c8cff; --accent-2: #a78bfa; --accent-soft: rgba(124,140,255,.14);
  --green: #34d399; --red: #f87171; --yellow: #fbbf24; --blue: #60a5fa;
  --radius: 14px; --radius-sm: 9px;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.28);
  --font: ui-sans-serif, "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--fg);
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(124,140,255,.10), transparent 60%),
    radial-gradient(700px 400px at -5% 110%, rgba(167,139,250,.07), transparent 60%),
    var(--bg);
  background-attachment: fixed; min-height: 100vh;
}
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

/* sidebar */
aside {
  position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px;
  background: linear-gradient(180deg, rgba(19,24,36,.85), rgba(15,19,27,.85)); backdrop-filter: blur(10px);
  border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px rgba(124,140,255,.35); }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--dim); font-size: 11px; margin-top: -2px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 0 10px 6px; }
#ns-select { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 10px; font: inherit; }
#ns-select:focus, input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--muted);
  padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; font: inherit; font-weight: 500; position: relative; transition: background .15s, color .15s;
}
nav button svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button:hover { background: rgba(255,255,255,.04); color: var(--fg); }
nav button.active { background: var(--accent-soft); color: #fff; }
nav button.active::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(var(--accent), var(--accent-2)); }
nav button.active svg { color: var(--accent); }

/* main */
.page { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 32px 6px; }
.topbar h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
main { padding: 16px 32px 48px; width: 100%; }
#loading { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: slide 1s infinite linear; display: none; }
@keyframes slide { from { background-position: -50% 0; } to { background-position: 150% 0; } }
#content { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* controls */
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar input { flex: 1; min-width: 220px; }
input, textarea, select { background: var(--bg-2); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font: inherit; }
button.btn, .toolbar button, dialog .actions button {
  background: var(--panel-2); color: var(--fg); border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 9px 16px; cursor: pointer; font: inherit; font-weight: 500; transition: transform .1s, filter .15s, border-color .15s;
}
.toolbar button:hover, dialog .actions button:hover { border-color: var(--dim); }
button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important; border-color: transparent !important; color: #fff !important; box-shadow: 0 4px 14px rgba(124,140,255,.3); }
button.primary:hover { filter: brightness(1.1); }
button:active { transform: translateY(1px); }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.stat:hover { border-color: var(--border-2); transform: translateY(-1px); }
.stat::after { content: ""; position: absolute; inset: auto -30px -40px auto; width: 110px; height: 110px; border-radius: 50%; background: var(--tone, var(--accent)); opacity: .09; filter: blur(8px); }
.stat .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px; color: var(--tone, var(--accent)); background: color-mix(in srgb, var(--tone, var(--accent)) 14%, transparent); }
.stat .ico svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.stat .num { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.stat .lbl { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

/* cards & tables */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
.card > h3 { margin: 0; padding: 16px 20px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--border); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
.tablewrap, .card table { background: transparent; }
body > .app main > #content > .tablewrap, #content > .tablewrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: rgba(255,255,255,.015); white-space: nowrap; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: rgba(255,255,255,.025); }
tr:last-child td { border-bottom: none; }
td.wrap { max-width: 720px; white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.active, .badge.confirmed { background: rgba(52,211,153,.12); color: var(--green); }
.badge.completed { background: rgba(96,165,250,.12); color: var(--blue); }
.badge.abandoned, .badge.rejected { background: rgba(248,113,113,.12); color: var(--red); }
.badge.pending, .badge.proposed { background: rgba(251,191,36,.12); color: var(--yellow); }
.badge.testing { background: rgba(96,165,250,.12); color: var(--blue); }
.conf { display: inline-flex; align-items: center; gap: 8px; min-width: 88px; }
.conf i { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.conf i b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.conf span { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; width: 32px; text-align: right; }
.row-actions { white-space: nowrap; }
.row-actions button { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 4px 10px; margin-right: 4px; cursor: pointer; font: inherit; font-size: 12px; transition: all .15s; }
.row-actions button:hover { color: var(--fg); border-color: var(--border-2); background: var(--panel-2); }
.row-actions button.danger:hover { color: var(--red); border-color: rgba(248,113,113,.4); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 28px; margin-bottom: 6px; opacity: .6; }
.empty.error { color: var(--red); }

/* dialog & toast */
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--border-2); border-radius: 16px; padding: 24px; max-width: 460px; width: 92%; box-shadow: 0 24px 64px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(5,7,12,.65); backdrop-filter: blur(3px); }
dialog h3 { margin: 0 0 4px; font-size: 17px; }
dialog label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 5px; }
dialog input, dialog textarea, dialog select { width: 100%; }
dialog textarea { min-height: 76px; resize: vertical; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
#toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--border-2); border-left: 3px solid var(--green); box-shadow: 0 12px 32px rgba(0,0,0,.4); display: none; z-index: 100; max-width: 380px; }
#toast.err { border-left-color: var(--red); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; flex-direction: column; border-right: 0; border-bottom: 1px solid var(--border); }
  nav { flex-direction: row; flex-wrap: wrap; }
  nav button { width: auto; }
  nav button.active::before { display: none; }
  .topbar, main { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">S</div><div><b>Stash</b><small>agent memory</small></div></div>
    <div>
      <div class="label">Namespace</div>
      <select id="ns-select" onchange="state.ns=this.value;refresh()"></select>
    </div>
    <div>
      <div class="label">Browse</div>
      <nav id="nav"></nav>
    </div>
  </aside>
  <div class="page">
    <div class="topbar"><div><h2 id="page-title">Overview</h2><p id="page-sub"></p></div></div>
    <div id="loading"></div>
    <main><div id="content"></div></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const API = '/api/v1';
const state = { tab: 'overview', ns: '', nsMap: {} };

const icons = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  episodes: '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  recall: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  facts: '<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  goals: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  hypotheses: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/>',
  contradictions: '<path d="m13 2-9 12h7l-1 8 9-12h-7z"/>',
  failures: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  links: '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  namespaces: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  runs: '<path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/>',
  metrics: '<path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/>',
};
const svg = k => `<svg viewBox="0 0 24 24">${icons[k]}</svg>`;

const tabs = [
  ['overview', 'Overview', 'A snapshot of what this memory knows'],
  ['episodes', 'Episodes', 'Raw memories, before they are consolidated into facts'],
  ['recall', 'Recall', 'Semantic search across episodes and facts'],
  ['facts', 'Facts', 'Stored facts with confidence'],
  ['goals', 'Goals', 'What the agent is working towards'],
  ['hypotheses', 'Hypotheses', 'Unverified beliefs waiting for evidence'],
  ['contradictions', 'Contradictions', 'Facts that disagree with each other'],
  ['failures', 'Failures', 'What went wrong, and what was learned'],
  ['links', 'Causal Links', 'Cause and effect between facts'],
  ['namespaces', 'Namespaces', 'How memory is organised'],
  ['runs', 'Runs', 'Recent consolidation runs and what changed'],
  ['metrics', 'Metrics', 'Runtime, consolidation and LLM usage metrics'],
];
const nav = document.getElementById('nav');
tabs.forEach(([id, label]) => {
  const b = document.createElement('button');
  b.dataset.tab = id; b.innerHTML = svg(id) + `<span>${label}</span>`;
  b.onclick = () => { state.tab = id; refresh(); };
  nav.appendChild(b);
});

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
}

function authHeaders() {
  let t = '';
  try { t = localStorage.getItem('stash_token') || ''; } catch (e) {}
  return t ? {'Authorization': 'Bearer ' + t} : {};
}
async function api(path, opts, retried) {
  opts = opts || {};
  const res = await fetch(API + path, Object.assign({}, opts, {
    headers: Object.assign({'Content-Type': 'application/json'}, authHeaders(), opts.headers || {})
  }));
  if (res.status === 401 && !retried) {
    const t = prompt('This Stash server requires an API token (STASH_API_TOKEN):');
    if (t) {
      try { localStorage.setItem('stash_token', t.trim()); } catch (e) {}
      return api(path, opts, true);
    }
  }
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || res.statusText);
  return body;
}
// Endpoints return either a bare array, {items: [...]}, or null; always hand back an array.
async function apiList(path) {
  const body = await api(path);
  if (Array.isArray(body)) return body;
  if (body && Array.isArray(body.items)) return body.items;
  return [];
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ts(s) { return s ? new Date(s).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : ''; }
function nsSlug(id) { return state.nsMap[id] || ('#' + id); }
function pct(v) { const n = Math.max(0, Math.min(1, Number(v) || 0)); return `<div class="conf"><i><b style="width:${n * 100}%"></b></i><span>${(n * 100).toFixed(0)}%</span></div>`; }

async function loadNamespaces() {
  const list = await apiList('/namespaces?limit=1000');
  const sel = document.getElementById('ns-select');
  sel.innerHTML = '<option value="/">All namespaces (/)</option>' +
    list.map(n => `<option value="${esc(n.slug)}">${esc(n.slug)}</option>`).join('');
  if (state.ns) sel.value = state.ns;
  list.forEach(n => state.nsMap[n.id] = n.slug);
  state.ns = sel.value;
}

function toolbar(html) { return `<div class="toolbar">${html}</div>`; }
function table(headers, rows) {
  if (!rows.length) return '<div class="empty"><div class="big">∅</div>Nothing here yet</div>';
  return `<div class="tablewrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function badge(v) { return v ? `<span class="badge ${esc(v)}">${esc(v)}</span>` : ''; }
function stat(key, tone, num, lbl) {
  return `<div class="stat" style="--tone:${tone}"><div class="ico">${svg(key)}</div><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
}

async function renderOverview() {
  const ns = encodeURIComponent(state.ns);
  const q = `?namespaces=${ns}&limit=1000`;
  const [eps, facts, goals, hyps, cons, fails] = await Promise.all([
    apiList('/episodes' + q), apiList('/facts' + q), apiList('/goals' + q), apiList('/hypotheses' + q),
    apiList('/contradictions' + q), apiList('/failures' + q),
  ]);
  const activeGoals = goals.filter(g => g.status === 'active').length;
  const pending = hyps.filter(h => h.status === 'pending').length;
  document.getElementById('content').innerHTML = `
    <div class="stats">
      ${stat('episodes', 'var(--blue)', eps.length, 'Episodes')}
      ${stat('facts', 'var(--accent)', facts.length, 'Facts')}
      ${stat('goals', 'var(--green)', activeGoals, 'Active goals')}
      ${stat('hypotheses', 'var(--yellow)', pending, 'Pending hypotheses')}
      ${stat('contradictions', 'var(--accent-2)', cons.length, 'Unresolved contradictions')}
      ${stat('failures', 'var(--red)', fails.length, 'Failures')}
    </div>
    <div class="card"><h3>Recent facts</h3>${table(['Content', 'Confidence', 'Created'],
      facts.slice(0, 10).map(f => `<tr><td class="wrap">${esc(f.content)}</td><td>${pct(f.confidence)}</td><td class="muted">${ts(f.created_at)}</td></tr>`))}</div>`;
}

async function renderRecall() {
  document.getElementById('content').innerHTML = toolbar(
    `<input id="q" placeholder="Ask your memory anything…" autofocus>` +
    `<button class="primary" onclick="doRecall()">Recall</button>`
  ) + '<div id="recall-out"></div>';
  document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doRecall(); });
}
async function doRecall() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  try {
    const res = await api('/recall', { method: 'POST', body: JSON.stringify({ query: q, namespaces: [state.ns], limit: 20 }) });
    const results = (res && res.results) || [];
    document.getElementById('recall-out').innerHTML = table(['Type', 'Content', 'Score', 'When'], results.map(r => `<tr>
      <td><span class="badge pending">${esc(r.type)}</span></td><td class="wrap">${esc(r.content)}</td>
      <td>${pct(r.score)}</td><td class="muted">${ts(r.occurred_at || r.created_at)}</td></tr>`));
  } catch (e) { toast(e.message, true); }
}

async function renderEpisodes() {
  const items = await apiList(`/episodes?namespaces=${encodeURIComponent(state.ns)}&limit=1000`);
  // Occurred = when it happened; show when it was stored too if that was noticeably later.
  const when = e => {
    const lag = new Date(e.created_at) - new Date(e.occurred_at);
    return ts(e.occurred_at) + (lag > 60000 ? `<div class="muted">stored ${ts(e.created_at)}</div>` : '');
  };
  document.getElementById('content').innerHTML = table(
    ['Episode', 'Namespace', 'When', ''],
    items.map(e => `<tr>
      <td class="wrap"><span class="mono">#${e.id}</span> ${esc(e.content)}</td>
      <td class="mono">${esc(nsSlug(e.namespace_id))}</td>
      <td class="muted">${when(e)}</td>
      <td class="row-actions"><button class="danger" onclick="purge('episodes', ${e.id})">purge</button></td>
    </tr>`));
}

async function renderFacts() {
  const ns = encodeURIComponent(state.ns);
  const [items, links] = await Promise.all([
    apiList(`/facts?namespaces=${ns}&limit=1000`),
    apiList(`/causal-links?namespaces=${ns}&limit=1000`),
  ]);
  // How many causal links point to / from each fact.
  const causes = new Map(), effects = new Map();
  for (const l of links) {
    effects.set(l.cause_fact_id, (effects.get(l.cause_fact_id) || 0) + 1);
    causes.set(l.effect_fact_id, (causes.get(l.effect_fact_id) || 0) + 1);
  }
  const now = Date.now();
  const status = f => f.valid_until && new Date(f.valid_until) < now ? 'abandoned'
    : f.valid_from && new Date(f.valid_from) > now ? 'pending' : 'active';
  const label = { abandoned: 'expired', pending: 'not yet valid', active: 'active' };
  const validity = f => {
    const s = status(f);
    const range = f.valid_from || f.valid_until
      ? `<div class="muted">${f.valid_from ? ts(f.valid_from) : '…'} → ${f.valid_until ? ts(f.valid_until) : 'open'}</div>` : '';
    return `<span class="badge ${s}">${label[s]}</span>${range}`;
  };
  const structured = f => f.entity || f.property || f.value
    ? `<b>${esc(f.entity)}</b> · ${esc(f.property)} → ${esc(f.value)}` : '<span class="muted">—</span>';
  const relations = f => {
    const c = causes.get(f.id) || 0, e = effects.get(f.id) || 0;
    return c || e ? `<span class="muted">${c} cause${c === 1 ? '' : 's'} · ${e} effect${e === 1 ? '' : 's'}</span>` : '<span class="muted">—</span>';
  };
  document.getElementById('content').innerHTML = table(
    ['Fact', 'Detail', 'Namespace', 'Validity', 'Links', 'Confidence', 'Created', ''],
    items.map(f => `<tr>
      <td class="wrap"><span class="mono">#${f.id}</span> ${esc(f.content)}</td>
      <td class="wrap">${structured(f)}</td>
      <td class="mono">${esc(nsSlug(f.namespace_id))}</td>
      <td>${validity(f)}</td>
      <td>${relations(f)}</td>
      <td>${pct(f.confidence)}</td>
      <td class="muted">${ts(f.created_at)}</td>
      <td class="row-actions"><button class="danger" onclick="purge('facts', ${f.id})">purge</button></td>
    </tr>`)
  );
}

async function renderGoals() {
  const ns = encodeURIComponent(state.ns);
  const [items, failures] = await Promise.all([
    apiList(`/goals?namespaces=${ns}&limit=1000`),
    apiList(`/failures?namespaces=${ns}&limit=1000`),
  ]);
  const byId = new Map(items.map(g => [g.id, g]));
  const subs = new Map(), fails = new Map();
  for (const g of items) if (g.parent_id) subs.set(g.parent_id, (subs.get(g.parent_id) || 0) + 1);
  for (const f of failures) if (f.goal_id) fails.set(f.goal_id, (fails.get(f.goal_id) || 0) + 1);
  const goal = g => `<span class="mono">#${g.id}</span> ${esc(g.content)}` +
    (g.parent_id ? `<div class="muted">part of ${byId.has(g.parent_id) ? `<span class="mono">#${g.parent_id}</span> ${esc(byId.get(g.parent_id).content)}` : `#${g.parent_id}`}</div>` : '') +
    (g.notes ? `<div class="muted">${esc(g.notes)}</div>` : '');
  const status = g => badge(g.status) +
    (g.completed_at ? `<div class="muted">${ts(g.completed_at)}</div>` : g.abandoned_at ? `<div class="muted">${ts(g.abandoned_at)}</div>` : '');
  const related = g => {
    const s = subs.get(g.id) || 0, f = fails.get(g.id) || 0;
    return s || f ? `<span class="muted">${s} subgoal${s === 1 ? '' : 's'} · ${f} failure${f === 1 ? '' : 's'}</span>` : '<span class="muted">—</span>';
  };
  document.getElementById('content').innerHTML = toolbar(
    `<button class="primary" onclick="goalDialog()">+ New goal</button>`) +
    table(['Goal', 'Status', 'Priority', 'Related', 'Namespace', 'Created', ''],
      items.map(g => `<tr>
        <td class="wrap">${goal(g)}</td>
        <td>${status(g)}</td>
        <td>${pct(Number(g.priority) / 10)}<div class="muted">${esc(g.priority)} / 10</div></td>
        <td>${related(g)}</td>
        <td class="mono">${esc(nsSlug(g.namespace_id))}</td>
        <td class="muted">${ts(g.created_at)}</td>
        <td class="row-actions">
          <button onclick="goalComplete(${g.id})">complete</button>
          <button onclick="goalAbandon(${g.id})">abandon</button>
          <button class="danger" onclick="del('goals', ${g.id})">delete</button>
        </td>
      </tr>`));
}
async function goalDialog() {
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>New goal</h3>
    <label>Content</label><textarea id="g-content"></textarea>
    <label>Priority (0-10)</label><input id="g-priority" type="number" value="5">
    <div class="actions"><button onclick="dlgClose()">Cancel</button><button class="primary" onclick="goalCreate()">Create</button></div>`;
  d.showModal();
}
async function goalCreate() {
  await api('/goals', { method: 'POST', body: JSON.stringify({
    namespaces: [state.ns], content: document.getElementById('g-content').value,
    priority: parseInt(document.getElementById('g-priority').value || '5', 10) }) });
  dlgClose(); refresh(); toast('Goal created');
}
async function goalComplete(id) {
  await api(`/goals/${id}/complete`, { method: 'POST', body: JSON.stringify({ notes: 'completed via UI' }) });
  refresh(); toast('Goal completed');
}
async function goalAbandon(id) {
  await api(`/goals/${id}/abandon`, { method: 'POST', body: JSON.stringify({ notes: 'abandoned via UI' }) });
  refresh(); toast('Goal abandoned');
}

async function renderHypotheses() {
  const ns = encodeURIComponent(state.ns);
  const [items, facts] = await Promise.all([
    apiList(`/hypotheses?namespaces=${ns}&limit=1000`),
    apiList(`/facts?namespaces=${ns}&limit=1000`),
  ]);
  const byId = new Map(facts.map(f => [f.id, f.content]));
  const factLine = id => `<div><span class="mono">#${id}</span> ${byId.has(id) ? esc(byId.get(id)) : '<span class="muted">(fact not available)</span>'}</div>`;
  // What the hypothesis is based on, and how it ended (if it did).
  const basis = h => (h.source_fact_ids || []).length
    ? h.source_fact_ids.map(factLine).join('') : '<span class="muted">—</span>';
  const outcome = h => {
    if (h.confirmed_fact_id) return `<div class="muted">${ts(h.confirmed_at)} → became fact</div>${factLine(h.confirmed_fact_id)}`;
    if (h.rejection_reason) return `<div class="muted">${ts(h.rejected_at)}</div><div>${esc(h.rejection_reason)}</div>`;
    if (h.tested_at) return `<div class="muted">tested ${ts(h.tested_at)}</div>`;
    return '';
  };
  document.getElementById('content').innerHTML = table(
    ['Hypothesis', 'Based on', 'How to verify', 'Namespace', 'Status', 'Confidence', 'Updated', ''],
    items.map(h => `<tr>
      <td class="wrap"><span class="mono">#${h.id}</span> ${esc(h.content)}</td>
      <td class="wrap">${basis(h)}</td>
      <td class="wrap muted">${esc(h.verification_plan)}</td>
      <td class="mono">${esc(nsSlug(h.namespace_id))}${h.method ? `<div class="muted">${esc(h.method)}</div>` : ''}</td>
      <td class="wrap">${badge(h.status)}${outcome(h)}</td>
      <td>${pct(h.confidence)}</td>
      <td class="muted">${ts(h.updated_at)}</td>
      <td class="row-actions">
        ${h.status === 'confirmed' || h.status === 'rejected' ? '' : `<button onclick="hypoConfirm(${h.id})">confirm</button>
        <button onclick="hypoReject(${h.id})">reject</button>`}
        <button class="danger" onclick="del('hypotheses', ${h.id})">delete</button>
      </td>
    </tr>`));
}
async function hypoConfirm(id) {
  await api(`/hypotheses/${id}/confirm`, { method: 'POST', body: '{}' }); refresh(); toast('Hypothesis confirmed');
}
async function hypoReject(id) {
  const reason = prompt('Rejection reason:') || 'rejected via UI';
  await api(`/hypotheses/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
  refresh(); toast('Hypothesis rejected');
}

async function renderContradictions() {
  const ns = encodeURIComponent(state.ns);
  const [items, facts] = await Promise.all([
    apiList(`/contradictions?namespaces=${ns}&limit=1000`),
    apiList(`/facts?namespaces=${ns}&limit=1000`),
  ]);
  const byId = new Map(facts.map(f => [f.id, f.content]));
  // The value, plus the fact it came from so you can see where the conflict originates.
  const side = (value, id) => `<div><b>${esc(value)}</b></div>` + (id
    ? `<div class="muted"><span class="mono">#${id}</span> ${byId.has(id) ? esc(byId.get(id)) : '(fact not available)'}</div>` : '');
  const state_ = c => c.resolved
    ? `<span class="badge completed">resolved</span>${c.resolution ? `<div>${esc(c.resolution)}</div>` : ''}${c.resolved_at ? `<div class="muted">${ts(c.resolved_at)}</div>` : ''}`
    : '<span class="badge pending">open</span>';
  document.getElementById('content').innerHTML = table(
    ['About', 'Old', 'New', 'Namespace', 'Status', 'Confidence', 'Created', ''],
    items.map(c => `<tr>
      <td class="wrap"><b>${esc(c.entity)}</b><div class="muted">${esc(c.property)}</div></td>
      <td class="wrap">${side(c.old_value, c.old_fact_id)}</td>
      <td class="wrap">${side(c.new_value, c.new_fact_id)}</td>
      <td class="mono">${esc(nsSlug(c.namespace_id))}${c.method ? `<div class="muted">${esc(c.method)}</div>` : ''}</td>
      <td class="wrap">${state_(c)}</td>
      <td>${pct(c.confidence)}</td>
      <td class="muted">${ts(c.created_at)}</td>
      <td class="row-actions">${c.resolved ? '' : `<button onclick="conResolve(${c.id})">resolve</button>`}</td>
    </tr>`));
}
async function conResolve(id) {
  const resolution = prompt('Resolution note:') || 'resolved via UI';
  await api(`/contradictions/${id}/resolve`, { method: 'POST', body: JSON.stringify({ resolution }) });
  refresh(); toast('Contradiction resolved');
}

async function renderFailures() {
  const ns = encodeURIComponent(state.ns);
  const [items, goals] = await Promise.all([
    apiList(`/failures?namespaces=${ns}&limit=1000`),
    apiList(`/goals?namespaces=${ns}&limit=1000`),
  ]);
  const goalById = new Map(goals.map(g => [g.id, g]));
  // The goal this attempt belonged to, so the failure reads in context.
  const goal = f => {
    if (!f.goal_id) return '<span class="muted">—</span>';
    const g = goalById.get(f.goal_id);
    return g
      ? `<div><span class="mono">#${g.id}</span> ${esc(g.content)}</div>${badge(g.status)}`
      : `<span class="mono">#${f.goal_id}</span> <span class="muted">(goal not available)</span>`;
  };
  document.getElementById('content').innerHTML = toolbar(
    `<button class="primary" onclick="failDialog()">+ Record failure</button>`) +
    table(['What failed', 'Why', 'Lesson', 'Goal', 'Namespace', 'Created', ''],
      items.map(f => `<tr>
        <td class="wrap"><span class="mono">#${f.id}</span> ${esc(f.content)}</td>
        <td class="wrap">${esc(f.reason)}</td>
        <td class="wrap"><b>${esc(f.lesson)}</b></td>
        <td class="wrap">${goal(f)}</td>
        <td class="mono">${esc(nsSlug(f.namespace_id))}</td>
        <td class="muted">${ts(f.created_at)}</td>
        <td class="row-actions"><button class="danger" onclick="del('failures', ${f.id})">delete</button></td>
      </tr>`));
}
async function failDialog() {
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>Record failure</h3>
    <label>What failed</label><textarea id="f-content"></textarea>
    <label>Why</label><textarea id="f-reason"></textarea>
    <label>Lesson</label><textarea id="f-lesson"></textarea>
    <div class="actions"><button onclick="dlgClose()">Cancel</button><button class="primary" onclick="failCreate()">Save</button></div>`;
  d.showModal();
}
async function failCreate() {
  await api('/failures', { method: 'POST', body: JSON.stringify({
    namespaces: [state.ns],
    content: document.getElementById('f-content').value,
    reason: document.getElementById('f-reason').value,
    lesson: document.getElementById('f-lesson').value }) });
  dlgClose(); refresh(); toast('Failure recorded');
}

async function renderLinks() {
  const ns = encodeURIComponent(state.ns);
  const [items, facts] = await Promise.all([
    apiList(`/causal-links?namespaces=${ns}&limit=1000`),
    apiList(`/facts?namespaces=${ns}&limit=1000`),
  ]);
  const byId = new Map(facts.map(f => [f.id, f.content]));
  // Show the fact text; fall back to the bare id for facts that are no longer listed.
  const fact = id => byId.has(id)
    ? `<span class="mono">#${id}</span> ${esc(byId.get(id))}`
    : `<span class="mono">#${id}</span> <span class="muted">(fact not available)</span>`;
  document.getElementById('content').innerHTML = table(
    ['Cause', '', 'Effect', 'Confidence', 'Method', 'Created'],
    items.map(l => `<tr>
      <td class="wrap">${fact(l.cause_fact_id)}</td>
      <td class="muted">→</td>
      <td class="wrap">${fact(l.effect_fact_id)}</td>
      <td>${pct(l.confidence)}</td>
      <td class="muted">${esc(l.method)}</td>
      <td class="muted">${ts(l.created_at)}</td>
    </tr>`));
}

async function renderNamespaces() {
  const [items, ...lists] = await Promise.all([
    apiList('/namespaces?limit=1000'),
    ...['episodes', 'facts', 'goals', 'hypotheses', 'failures'].map(k => apiList(`/${k}?namespaces=${encodeURIComponent('/')}&limit=1000`)),
  ]);
  const kinds = ['episodes', 'facts', 'goals', 'hypotheses', 'failures'];
  // Direct item counts per namespace (the API returns everything under "/").
  const counts = new Map(items.map(n => [n.id, {}]));
  lists.forEach((list, i) => list.forEach(x => {
    const c = counts.get(x.namespace_id); if (c) c[kinds[i]] = (c[kinds[i]] || 0) + 1;
  }));
  const capped = lists.map(l => l.length >= 1000);
  const cell = (n, i) => {
    const v = counts.get(n.id)[kinds[i]] || 0;
    return v ? `${v}${capped[i] ? '+' : ''}` : '<span class="muted">—</span>';
  };
  const slugs = [...items].sort((a, b) => a.slug.localeCompare(b.slug));
  const depth = n => n.slug.split('/').filter(Boolean).length - 1;
  document.getElementById('content').innerHTML = toolbar(
    `<button class="primary" onclick="nsDialog()">+ New namespace</button>`) +
    table(['Namespace', 'Description', 'Episodes', 'Facts', 'Goals', 'Hypotheses', 'Failures', 'Created'],
      slugs.map(n => `<tr>
        <td style="padding-left:${16 + depth(n) * 18}px"><b>${esc(n.name || n.slug)}</b><div class="mono">${esc(n.slug)}</div></td>
        <td class="wrap muted">${esc(n.description)}</td>
        ${kinds.map((_, i) => `<td>${cell(n, i)}</td>`).join('')}
        <td class="muted">${ts(n.created_at)}</td>
      </tr>`));
}
async function renderMetrics() {
  const body = await api('/metrics');
  const items = (body && body.metrics) || [];
  const byName = new Map();
  for (const m of items) byName.set(m.name, (byName.get(m.name) || 0) + 1);
  const reasoner = items.filter(m => m.name.startsWith('reasoner_'));
  const sum = name => reasoner.filter(m => m.name === name).reduce((n, m) => n + Number(m.value || 0), 0);
  const prompt = sum('reasoner_prompt_tokens_total');
  const completion = sum('reasoner_completion_tokens_total');
  const cost = sum('reasoner_cost_total');
  const unpriced = sum('reasoner_unpriced_calls_total');
  // Estimated cost per stage, from the reasoner_cost_total series.
  const byStage = new Map();
  for (const m of reasoner) {
    if (m.name !== 'reasoner_cost_total') continue;
    const stage = (m.labels && m.labels.stage) || 'unknown';
    byStage.set(stage, (byStage.get(stage) || 0) + Number(m.value || 0));
  }
  const money = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const costRows = [...byStage.entries()].sort((a, b) => b[1] - a[1])
    .map(([stage, v]) => `<tr><td class="mono">${esc(stage)}</td><td class="mono">${money(v)}</td></tr>`);
  const hint = unpriced > 0
    ? `<div class="muted">${unpriced.toLocaleString()} call(s) used a model without a configured price — set STASH_MODEL_PRICES to price them.</div>` : '';
  document.getElementById('content').innerHTML =
    `<div class="stats">
      ${stat('metrics', 'var(--green)', money(cost), 'Estimated reasoner cost')}
      ${stat('metrics', 'var(--red)', unpriced.toLocaleString(), 'Unpriced reasoner calls')}
      ${stat('metrics', 'var(--accent)', items.length, 'Metric samples')}
      ${stat('metrics', 'var(--blue)', byName.size, 'Metric families')}
      ${stat('metrics', 'var(--yellow)', prompt.toLocaleString(), 'Reasoner prompt tokens')}
      ${stat('metrics', 'var(--red)', completion.toLocaleString(), 'Reasoner completion tokens')}
    </div>` +
    (costRows.length ? `<div class="card"><h3>Estimated cost by stage ${hint ? '' : ''}</h3>${hint}<div class="tablewrap"><table><thead><tr><th>Stage</th><th>Cost (configured unit)</th></tr></thead><tbody>${costRows.join('')}</tbody></table></div></div>` : '') +
    `<div class="card"><h3>All metrics <span class="muted">${esc(ts(body.updated_at))}</span></h3>` +
    table(['Metric', 'Type', 'Labels', 'Value'], items.map(m => `<tr>
      <td><b>${esc(m.name)}</b>${m.help ? `<div class="muted">${esc(m.help)}</div>` : ''}</td>
      <td class="muted">${esc(m.type)}</td>
      <td class="mono">${esc(Object.entries(m.labels || {}).map(([k, v]) => `${k}=${v}`).join(', '))}</td>
      <td class="mono">${Number(m.value).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
    </tr>`)) + '</div>';
}
async function nsDialog() {
  const d = document.getElementById('dlg');
  d.innerHTML = `<h3>New namespace</h3>
    <label>Slug (e.g. /work/projects)</label><input id="n-slug">
    <label>Name</label><input id="n-name">
    <label>Description</label><input id="n-desc">
    <div class="actions"><button onclick="dlgClose()">Cancel</button><button class="primary" onclick="nsCreate()">Create</button></div>`;
  d.showModal();
}
async function nsCreate() {
  const slug = document.getElementById('n-slug').value.trim();
  await api('/namespaces', { method: 'POST', body: JSON.stringify({
    slug, name: document.getElementById('n-name').value,
    description: document.getElementById('n-desc').value }) });
  dlgClose(); await loadNamespaces(); refresh(); toast('Namespace created');
}

async function purge(kind, id) {
  if (!confirm(`Purge ${kind.slice(0, -1)} #${id}? This cannot be undone.`)) return;
  await api(`/${kind}/${id}`, { method: 'DELETE' }); refresh(); toast('Purged');
}
async function del(kind, id) {
  if (!confirm(`Delete ${kind.slice(0, -1)} #${id}?`)) return;
  await api(`/${kind}/${id}`, { method: 'DELETE' }); refresh(); toast('Deleted');
}
function dlgClose() { document.getElementById('dlg').close(); }

async function renderRuns() {
  const items = await apiList(`/runs?namespaces=${encodeURIComponent(state.ns)}&limit=200`);
  const dur = ms => ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : (ms || 0) + 'ms';
  const n = v => v ? String(v) : '<span class="muted">—</span>';
  document.getElementById('content').innerHTML = table(
    ['Started', 'Namespace', 'Duration', 'Episodes', 'Facts', 'Dedup', 'Rels', 'Patterns', 'Contra', 'LLM calls', 'Errors'],
    items.map(r => `<tr>
      <td class="muted">${ts(r.started_at)}</td>
      <td class="mono">${esc(r.namespace_slug || nsSlug(r.namespace_id))}</td>
      <td class="mono">${dur(r.duration_ms)}</td>
      <td>${n(r.episodes_read)}</td>
      <td>${n(r.facts_created)}</td>
      <td>${n(r.facts_deduplicated)}</td>
      <td>${n(r.relationships_found)}</td>
      <td>${n(r.patterns_found)}</td>
      <td>${n(r.contradictions_found)}</td>
      <td>${n(r.llm_calls)}${r.llm_calls_limited ? ' <span class="badge pending">limited</span>' : ''}</td>
      <td>${r.errors ? `<span class="badge abandoned">${r.errors}</span>${r.error_sample ? `<div class="muted">${esc(r.error_sample)}</div>` : ''}` : '<span class="muted">—</span>'}</td>
    </tr>`));
}
const renderers = { overview: renderOverview, episodes: renderEpisodes, recall: renderRecall, facts: renderFacts,
  goals: renderGoals, hypotheses: renderHypotheses, contradictions: renderContradictions,
  failures: renderFailures, links: renderLinks, namespaces: renderNamespaces, runs: renderRuns, metrics: renderMetrics };

async function refresh() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const t = tabs.find(x => x[0] === state.tab);
  document.getElementById('page-title').textContent = t[1];
  document.getElementById('page-sub').textContent = t[2];
  document.getElementById('ns-select').disabled = state.tab === 'namespaces';
  const c = document.getElementById('content');
  document.getElementById('loading').style.display = 'block';
  try {
    await loadNamespaces();
    c.innerHTML = '';
    await renderers[state.tab]();
  } catch (e) {
    c.innerHTML = `<div class="empty error">${esc(e.message)}</div>`;
    toast(e.message, true);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}
refresh();
</script>
</body>
